<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aetheria — VR Flying Spaceship Simulator | Meta Quest 3</title>
  <meta name="description" content="A high-speed 6DoF VR Spaceship Flight Simulator built with A-Frame for Meta Quest 3 and Desktop.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- A-Frame 1.7.1 & A-Frame Extras -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #ec4899;
      --cyan: #06b6d4;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000;
      user-select: none;
    }

    /* 2D Pilot HUD Overlay */
    #pilot-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 999;
      background: rgba(8, 12, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 16px;
      padding: 16px 20px;
      color: #fff;
      min-width: 280px;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.25);
    }

    .hud-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--cyan), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hud-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .hud-value {
      font-family: monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .controls-help {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .key-tag {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      color: #fff;
    }

    /* VR Enter Button */
    .a-enter-vr-button {
      background: linear-gradient(135deg, var(--cyan), var(--primary)) !important;
      border-radius: 14px !important;
      border: none !important;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.6) !important;
    }
  </style>

  <script>
    // Web Audio Synthesizer for Engine Sound & Ring Chimes
    const ShipAudio = {
      ctx: null,
      engineOsc: null,
      engineGain: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          
          // Continuous Engine Hum Oscillator
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.value = 55; // Deep rumble
          this.engineGain.gain.value = 0.05; // Low volume engine hum
          
          // Lowpass filter to smooth out engine sound
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 300;

          this.engineOsc.connect(filter);
          filter.connect(this.engineGain);
          this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        }
      },
      setThrottle(speedRatio) {
        if (this.ctx && this.engineOsc && this.engineGain) {
          const targetFreq = 55 + speedRatio * 160;
          const targetVol = 0.04 + speedRatio * 0.12;
          this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);
          this.engineGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.1);
        }
      },
      playRingPass() {
        if (!this.ctx) this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.05 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.05);
            osc.stop(this.ctx.currentTime + idx * 0.05 + 0.3);
          } catch(e) {}
        });
      }
    };

    // Spaceship Pilot Controls Component
    AFRAME.registerComponent('spaceship-controls', {
      schema: {
        speed: { type: 'number', default: 15 },
        maxSpeed: { type: 'number', default: 60 },
        minSpeed: { type: 'number', default: 5 },
        pitchSpeed: { type: 'number', default: 0.6 },
        yawSpeed: { type: 'number', default: 0.6 },
        rollSpeed: { type: 'number', default: 0.8 }
      },

      init: function () {
        this.currentSpeed = this.data.speed;
        this.keys = {};
        this.ringsPassed = 0;
        this.totalRings = 6;

        // Bind keyboard listeners
        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
          ShipAudio.init();
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });

        // Touch / Click anywhere to start audio engine
        window.addEventListener('click', () => ShipAudio.init());
      },

      tick: function (time, delta) {
        const dt = delta / 1000;
        if (!dt) return;

        const el = this.el;
        const rotation = el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        const position = el.getAttribute('position') || { x: 0, y: 0, z: 0 };

        // Throttle Controls
        if (this.keys['KeyW'] || this.keys['ArrowUp']) {
          this.currentSpeed = Math.min(this.data.maxSpeed, this.currentSpeed + 25 * dt);
        } else if (this.keys['KeyS'] || this.keys['ArrowDown']) {
          this.currentSpeed = Math.max(this.data.minSpeed, this.currentSpeed - 25 * dt);
        }

        // Boost / Brake
        if (this.keys['Space']) {
          this.currentSpeed = Math.min(this.data.maxSpeed * 1.5, this.currentSpeed + 40 * dt);
        }

        // Flight Steering (Pitch / Yaw / Roll)
        let pitchDelta = 0;
        let yawDelta = 0;
        let rollDelta = 0;

        // Pitch (Nose Up / Down) with I / K
        if (this.keys['KeyI'] || this.keys['Numpad8']) pitchDelta += 45 * dt;
        if (this.keys['KeyK'] || this.keys['Numpad2']) pitchDelta -= 45 * dt;

        // Steering (A / D: Yaw + Bank Roll)
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) {
          yawDelta += 40 * dt;
          rollDelta += 30 * dt;
        }
        if (this.keys['KeyD'] || this.keys['ArrowRight']) {
          yawDelta -= 40 * dt;
          rollDelta -= 30 * dt;
        }

        // VR Controller Support (Meta Quest 3 Thumbsticks & Rotation)
        const rightController = document.querySelector('#rightController');
        if (rightController && rightController.components['tracked-controls']) {
          const axis = rightController.components['tracked-controls'].axis;
          if (axis && axis.length >= 2) {
            yawDelta -= axis[0] * 50 * dt;
            pitchDelta -= axis[1] * 50 * dt;
          }
        }

        // Auto-stabilize roll back to 0
        rollDelta -= rotation.z * 1.5 * dt;

        // Update Rotation
        const newPitch = rotation.x + pitchDelta;
        const newYaw = rotation.y + yawDelta;
        const newRoll = Math.max(-45, Math.min(45, rotation.z + rollDelta));

        el.setAttribute('rotation', { x: newPitch, y: newYaw, z: newRoll });

        // Calculate Forward Thrust Vector from Rotation
        const pitchRad = THREE.MathUtils.degToRad(newPitch);
        const yawRad = THREE.MathUtils.degToRad(newYaw);

        const dx = -Math.sin(yawRad) * Math.cos(pitchRad) * this.currentSpeed * dt;
        const dy = Math.sin(pitchRad) * this.currentSpeed * dt;
        const dz = -Math.cos(yawRad) * Math.cos(pitchRad) * this.currentSpeed * dt;

        el.setAttribute('position', {
          x: position.x + dx,
          y: position.y + dy,
          z: position.z + dz
        });

        // Update Audio Engine Sound
        ShipAudio.setThrottle(this.currentSpeed / this.data.maxSpeed);

        // Update 2D & 3D HUD Stats
        this.updateHUD(position, this.currentSpeed);

        // Ring Pass Collision Detection
        this.checkRingCollisions(position);
      },

      updateHUD: function (pos, speed) {
        const speedKm = Math.round(speed * 3.6);
        const altM = Math.round(pos.y + 100);

        const hudSpeed = document.querySelector('#hud-speed');
        const hudAlt = document.querySelector('#hud-alt');
        const hudScore = document.querySelector('#hud-score');

        if (hudSpeed) hudSpeed.textContent = `${speedKm} KM/H`;
        if (hudAlt) hudAlt.textContent = `${altM} M`;
        if (hudScore) hudScore.textContent = `${this.ringsPassed} / ${this.totalRings}`;

        // 3D Cockpit HUD Updates
        const textSpeed = document.querySelector('#cockpit-speed-text');
        const textAlt = document.querySelector('#cockpit-alt-text');
        if (textSpeed) textSpeed.setAttribute('value', `SPD: ${speedKm} KM/H`);
        if (textAlt) textAlt.setAttribute('value', `ALT: ${altM} M`);
      },

      checkRingCollisions: function (shipPos) {
        const rings = document.querySelectorAll('.ring-target');
        rings.forEach((ring) => {
          if (ring.dataset.passed === 'true') return;

          const ringPos = ring.object3D.position;
          const dist = shipPos.distanceTo(ringPos);

          if (dist < 6) { // Passed through ring radius!
            ring.dataset.passed = 'true';
            ring.setAttribute('material', 'color: #10b981; emissive: #10b981; emissiveIntensity: 1');
            this.ringsPassed++;
            ShipAudio.playRingPass();

            // Temporary Speed Boost
            this.currentSpeed = Math.min(this.data.maxSpeed * 1.4, this.currentSpeed + 15);

            // Ring pass animation
            ring.setAttribute('animation__pass', 'property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 300; loop: 1');
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- 2D Pilot HUD Overlay -->
  <div id="pilot-hud">
    <div class="hud-title">
      🛸 SPACESHIP PILOT COCKPIT
      <span style="font-size: 0.7rem; color: #10b981;">● ONLINE</span>
    </div>
    
    <div class="hud-stat-row">
      <span>AIRSPEED:</span>
      <span class="hud-value" id="hud-speed">0 KM/H</span>
    </div>
    
    <div class="hud-stat-row">
      <span>ALTITUDE:</span>
      <span class="hud-value" id="hud-alt">0 M</span>
    </div>

    <div class="hud-stat-row">
      <span>ENERGY RINGS:</span>
      <span class="hud-value" id="hud-score">0 / 6</span>
    </div>

    <div class="controls-help">
      <strong>FLIGHT CONTROLS:</strong><br>
      • <kbd class="key-tag">W</kbd> / <kbd class="key-tag">S</kbd> : Throttle Speed Up / Down<br>
      • <kbd class="key-tag">A</kbd> / <kbd class="key-tag">D</kbd> : Steer Left / Right (Yaw & Roll)<br>
      • <kbd class="key-tag">I</kbd> / <kbd class="key-tag">K</kbd> : Pitch Nose Up / Down<br>
      • <kbd class="key-tag">Space</kbd> : Turbo Engine Boost<br>
      • <strong>Quest 3 VR</strong>: Use Right Touch Thumbstick to steer ship!
    </div>
  </div>

  <!-- A-Frame VR Scene -->
  <a-scene 
    renderer="antialias: true; colorManagement: true; exposure: 1.2;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Preloaded Assets -->
    <a-assets>
      <a-asset-item id="robot-model" src="https://modelviewer.dev/shared-assets/models/robot.glb"></a-asset-item>
      <a-asset-item id="helmet-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"></a-asset-item>
      <a-asset-item id="astronaut-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
      
      <img id="space-grid" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
      <img id="space-sky" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Deep Space Skybox -->
    <a-sky src="#space-sky" rotation="0 -90 0"></a-sky>

    <!-- Planetary Surface Below -->
    <a-plane 
      position="0 -20 0" 
      rotation="-90 0 0" 
      width="1000" 
      height="1000" 
      src="#space-grid" 
      repeat="100 100" 
      material="roughness: 0.5; metalness: 0.7">
    </a-plane>

    <!-- Ambient & Sun Lights -->
    <a-light type="ambient" color="#38bdf8" intensity="0.5"></a-light>
    <a-light type="directional" color="#ec4899" intensity="1.0" position="-10 30 10"></a-light>


    <!-- ================= PILOT SPACESHIP RIG ================= -->
    <!-- The camera and cockpit are parented inside this flying ship rig -->
    <a-entity id="spaceshipRig" spaceship-controls position="0 5 0">

      <!-- Camera (Pilot's Eye View inside Cockpit) -->
      <a-entity id="camera" camera position="0 1.2 0" look-controls="pointerLockEnabled: false">
        
        <!-- ================= 3D SPACESHIP COCKPIT INTERIOR ================= -->
        <a-entity id="cockpit" position="0 0 -0.5">
          <!-- Glass Canopy Canopy Frame Left/Right -->
          <a-cylinder position="-0.6 0.2 -0.4" rotation="30 20 -40" radius="0.02" height="1.2" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.8"></a-cylinder>
          <a-cylinder position="0.6 0.2 -0.4" rotation="30 -20 40" radius="0.02" height="1.2" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.8"></a-cylinder>
          <a-torus position="0 0.3 -0.6" radius="0.6" radius-tubular="0.015" material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.9" arc="180"></a-torus>

          <!-- Pilot Dashboard Console -->
          <a-box position="0 -0.4 -0.6" width="1.2" height="0.3" depth="0.4" material="color: #090d16; roughness: 0.2; metalness: 0.9"></a-box>
          <a-box position="0 -0.24 -0.5" width="1.0" height="0.05" depth="0.2" material="color: #1e1b4b; emissive: #6366f1; emissiveIntensity: 0.4"></a-box>

          <!-- Flight Control Joystick Yoke -->
          <a-cylinder position="0 -0.15 -0.4" rotation="-20 0 0" radius="0.025" height="0.3" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 0.8"></a-cylinder>
          <a-sphere position="0 0 -0.35" radius="0.05" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 1"></a-sphere>

          <!-- Floating Holographic Flight Reticle (Crosshair) -->
          <a-ring position="0 0 -1" radius-inner="0.025" radius-outer="0.03" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 1; shader: flat"></a-ring>
          <a-circle position="0 0 -1" radius="0.005" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 1; shader: flat"></a-circle>

          <!-- 3D Cockpit Gauges -->
          <a-text id="cockpit-speed-text" value="SPD: 54 KM/H" position="-0.4 -0.2 -0.5" scale="0.18 0.18 0.18" color="#06b6d4" font="kelsonsans"></a-text>
          <a-text id="cockpit-alt-text" value="ALT: 105 M" position="0.1 -0.2 -0.5" scale="0.18 0.18 0.18" color="#ec4899" font="kelsonsans"></a-text>
        </a-entity>

        <!-- Reticle Cursor -->
        <a-cursor
          id="cursor"
          color="#06b6d4"
          fuse="false"
          raycaster="objects: .clickable; far: 40">
        </a-cursor>
      </a-entity>

      <!-- Spaceship Body Wings & Thruster Lights (Visible when looking back) -->
      <a-box position="0 0.5 1.2" width="2.4" height="0.2" depth="1.5" material="color: #0f172a; roughness: 0.2; metalness: 0.8"></a-box>
      <a-cone position="-1.5 0.5 1.5" rotation="90 0 0" radius-bottom="0.4" radius-top="0.05" height="1.2" material="color: #6366f1; roughness: 0.3"></a-cone>
      <a-cone position="1.5 0.5 1.5" rotation="90 0 0" radius-bottom="0.4" radius-top="0.05" height="1.2" material="color: #6366f1; roughness: 0.3"></a-cone>
      
      <!-- Rear Engine Plasma Glow -->
      <a-sphere position="-1.5 0.5 2.1" radius="0.25" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 1"></a-sphere>
      <a-sphere position="1.5 0.5 2.1" radius="0.25" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 1"></a-sphere>
      <a-light type="point" position="0 0.5 2.5" color="#06b6d4" intensity="2" distance="8"></a-light>

      <!-- VR Touch Controllers -->
      <a-entity id="leftController"
        meta-touch-controls="hand: left"
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 40"
        line="color: #06b6d4; opacity: 0.9">
      </a-entity>
      <a-entity id="rightController"
        meta-touch-controls="hand: right"
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 40"
        line="color: #ec4899; opacity: 0.9">
      </a-entity>
    </a-entity>


    <!-- ================= AERIAL SLALOM ENERGY RING COURSE ================= -->
    <!-- Fly through these glowing rings to score points & speed boost! -->

    <a-entity class="ring-target" position="0 8 -30" rotation="0 0 0">
      <a-torus radius="4" radius-tubular="0.2" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.8" animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear"></a-torus>
      <a-text value="RING 1" position="0 5 0" align="center" color="#06b6d4" width="6" font="kelsonsans"></a-text>
    </a-entity>

    <a-entity class="ring-target" position="-15 14 -70" rotation="0 15 0">
      <a-torus radius="4" radius-tubular="0.2" material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.8" animation="property: rotation; to: 0 0 -360; loop: true; dur: 8000; easing: linear"></a-torus>
      <a-text value="RING 2" position="0 5 0" align="center" color="#6366f1" width="6" font="kelsonsans"></a-text>
    </a-entity>

    <a-entity class="ring-target" position="-30 22 -120" rotation="10 30 0">
      <a-torus radius="4.5" radius-tubular="0.2" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 0.8" animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear"></a-torus>
      <a-text value="RING 3" position="0 5.5 0" align="center" color="#ec4899" width="6" font="kelsonsans"></a-text>
    </a-entity>

    <a-entity class="ring-target" position="0 30 -170" rotation="15 0 0">
      <a-torus radius="5" radius-tubular="0.25" material="color: #10b981; emissive: #10b981; emissiveIntensity: 0.9" animation="property: rotation; to: 0 0 -360; loop: true; dur: 7000; easing: linear"></a-torus>
      <a-text value="RING 4" position="0 6 0" align="center" color="#10b981" width="6" font="kelsonsans"></a-text>
    </a-entity>

    <a-entity class="ring-target" position="35 25 -220" rotation="0 -30 0">
      <a-torus radius="5" radius-tubular="0.25" material="color: #f59e0b; emissive: #f59e0b; emissiveIntensity: 0.9" animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear"></a-torus>
      <a-text value="RING 5" position="0 6 0" align="center" color="#f59e0b" width="6" font="kelsonsans"></a-text>
    </a-entity>

    <a-entity class="ring-target" position="50 15 -270" rotation="-10 -40 0">
      <a-torus radius="5.5" radius-tubular="0.25" material="color: #a855f7; emissive: #a855f7; emissiveIntensity: 0.9" animation="property: rotation; to: 0 0 -360; loop: true; dur: 6000; easing: linear"></a-torus>
      <a-text value="RING 6" position="0 6.5 0" align="center" color="#a855f7" width="6" font="kelsonsans"></a-text>
    </a-entity>


    <!-- ================= FLOATING ASTEROIDS & SPACE OBJECTS ================= -->

    <!-- Floating Space Station Landmark -->
    <a-entity position="0 50 -350">
      <a-torus radius="25" radius-tubular="1.5" material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.5; roughness: 0.2" animation="property: rotation; to: 360 360 0; loop: true; dur: 30000; easing: linear"></a-torus>
      <a-sphere radius="8" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.6; roughness: 0.1"></a-sphere>
      <a-light type="point" color="#06b6d4" intensity="4" distance="60"></a-light>
      <a-text value="GALACTIC SPACE STATION" position="0 14 0" align="center" color="#38bdf8" width="15" font="kelsonsans"></a-text>
    </a-entity>

    <!-- Floating Asteroids -->
    <a-dodecahedron position="-40 20 -100" radius="6" material="color: #334155; roughness: 0.9" animation="property: rotation; to: 360 180 360; loop: true; dur: 25000; easing: linear"></a-dodecahedron>
    <a-dodecahedron position="45 35 -150" radius="8" material="color: #1e293b; roughness: 0.8" animation="property: rotation; to: -360 360 -180; loop: true; dur: 35000; easing: linear"></a-dodecahedron>
    <a-dodecahedron position="-60 45 -250" radius="12" material="color: #334155; roughness: 0.9" animation="property: rotation; to: 180 360 180; loop: true; dur: 40000; easing: linear"></a-dodecahedron>


    <!-- ================= INTERACTIVE 3D EXHIBIT MODELS ================= -->

    <!-- Damaged Relic Helmet floating in Space Station Sector -->
    <a-entity position="-12 10 -40" rotation="0 45 0" class="clickable">
      <a-gltf-model src="#helmet-model" scale="2 2 2" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear"></a-gltf-model>
      <a-light type="point" color="#06b6d4" intensity="2" distance="10"></a-light>
    </a-entity>

    <!-- Astronaut Floating in Deep Space -->
    <a-entity position="15 15 -50" rotation="0 -45 0" class="clickable">
      <a-gltf-model src="#astronaut-model" scale="1.5 1.5 1.5" animation__float="property: position; dir: alternate; to: 15 18 -50; loop: true; dur: 3000; easing: easeInOutQuad"></a-gltf-model>
