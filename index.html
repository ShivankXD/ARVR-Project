<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aetheria VR — Interactive 3D World | Meta Quest 3</title>
  <meta name="description" content="Aetheria VR — High-fidelity WebVR exploration world for Meta Quest 3 and Desktop.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- A-Frame 1.7.1 & A-Frame Extras -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #ec4899;
      --cyan: #06b6d4;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #030712;
      user-select: none;
    }

    /* Minimal HUD Overlay */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      max-width: 300px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .hud-title {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .hud-text {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.45;
    }

    .hud-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 2px 8px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      font-size: 0.7rem;
      color: #818cf8;
      font-weight: 600;
    }

    /* VR Button */
    .a-enter-vr-button {
      background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
      border-radius: 12px !important;
      border: none !important;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5) !important;
    }
  </style>

  <script>
    // Web Audio Synthesizer
    const AudioSFX = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      play(freq, type = 'sine', duration = 0.3) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      chime() {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.35), i * 70));
      }
    };

    // Hover scale component
    AFRAME.registerComponent('hover-grow', {
      init: function () {
        const el = this.el;
        const s = el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
        el.addEventListener('mouseenter', () => {
          el.setAttribute('animation__hover', `property: scale; to: ${s.x * 1.1} ${s.y * 1.1} ${s.z * 1.1}; dur: 200; easing: easeOutQuad`);
          AudioSFX.play(880, 'sine', 0.15);
        });
        el.addEventListener('mouseleave', () => {
          el.setAttribute('animation__hover', `property: scale; to: ${s.x} ${s.y} ${s.z}; dur: 200; easing: easeOutQuad`);
        });
      }
    });

    // Interactive Crystal Color Cycler
    AFRAME.registerComponent('crystal-toggle', {
      init: function () {
        const el = this.el;
        const light = el.querySelector('a-light');
        const octa = el.querySelector('a-octahedron');
        const text = document.querySelector('#crystal-label');
        const colors = [
          { c: '#6366f1', name: 'Indigo Core' },
          { c: '#ec4899', name: 'Neon Magenta' },
          { c: '#06b6d4', name: 'Cyan Plasma' },
          { c: '#10b981', name: 'Emerald Aura' },
          { c: '#f59e0b', name: 'Solar Gold' }
        ];
        let i = 0;

        el.addEventListener('click', () => {
          i = (i + 1) % colors.length;
          const curr = colors[i];
          if (octa) {
            octa.setAttribute('material', `color: ${curr.c}; emissive: ${curr.c}; emissiveIntensity: 0.8; roughness: 0.1; metalness: 0.9`);
          }
          if (light) light.setAttribute('color', curr.c);
          if (text) text.setAttribute('value', curr.name);
          AudioSFX.chime();
        });
      }
    });

    // Robot Dance Toggle
    AFRAME.registerComponent('robot-toggle', {
      init: function () {
        const el = this.el;
        const anims = ['Dance', 'Jump', 'Walk', 'Idle'];
        let i = 0;
        el.addEventListener('click', () => {
          i = (i + 1) % anims.length;
          const anim = anims[i];
          el.setAttribute('animation-mixer', `clip: ${anim}; loop: repeat;`);
          AudioSFX.play(660, 'square', 0.2);
          const label = document.querySelector('#robot-label');
          if (label) label.setAttribute('value', `Robot: ${anim}`);
        });
      }
    });
  </script>
</head>
<body>

  <!-- UI Card -->
  <div id="hud">
    <div class="hud-title">✨ Aetheria VR Showcase</div>
    <div class="hud-text">
      Interactive 3D & VR World for <strong>Meta Quest 3 / 3s</strong>.<br>
      • <strong>WASD</strong>: Move around<br>
      • <strong>Mouse Drag</strong>: Look around<br>
      • <strong>Click</strong>: Interact with objects
    </div>
    <span class="hud-badge">A-Frame 1.7.1 • WebXR Ready</span>
  </div>

  <!-- A-Frame VR Scene -->
  <a-scene 
    renderer="antialias: true; colorManagement: true; exposure: 1.2;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Preloaded GLTF Assets -->
    <a-assets>
      <a-asset-item id="robot-gltf" src="https://modelviewer.dev/shared-assets/models/robot.glb"></a-asset-item>
      <a-asset-item id="helmet-gltf" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"></a-asset-item>
      <a-asset-item id="astro-gltf" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
      <img id="grid-texture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
      <img id="sky-texture" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Sky Sphere (360 Panorama) -->
    <a-sky src="#sky-texture" rotation="0 -90 0"></a-sky>

    <!-- Ground Plane (Dark Metallic Grid) -->
    <a-plane 
      position="0 0 0" 
      rotation="-90 0 0" 
      width="60" 
      height="60" 
      src="#grid-texture" 
      repeat="15 15" 
      material="roughness: 0.4; metalness: 0.6">
    </a-plane>

    <!-- Environment Ambient & Directional Lights -->
    <a-light type="ambient" color="#64748b" intensity="0.6"></a-light>
    <a-light type="directional" color="#f472b6" intensity="1.0" position="-4 10 4" cast-shadow="true"></a-light>
    <a-light type="point" color="#6366f1" intensity="2" position="0 4 -4" distance="15"></a-light>

    <!-- Camera Rig & Controllers -->
    <a-entity id="rig" movement-controls="speed: 0.18; fly: false;" position="0 0 3.5">
      <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
        <a-cursor
          id="cursor"
          color="#6366f1"
          fuse="false"
          raycaster="objects: .clickable; far: 30"
          animation__click="property: scale; startEvents: click; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-entity>

      <!-- Quest 3 Left Controller -->
      <a-entity id="leftController"
        meta-touch-controls="hand: left"
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 30"
        line="color: #06b6d4; opacity: 0.9">
      </a-entity>

      <!-- Quest 3 Right Controller -->
      <a-entity id="rightController"
        meta-touch-controls="hand: right"
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 30"
        line="color: #ec4899; opacity: 0.9">
      </a-entity>
    </a-entity>


    <!-- ================= EXHIBITION OBJECTS ================= -->

    <!-- 1. Center Exhibit: Floating Energy Crystal Core -->
    <a-entity position="0 1.2 -4" crystal-toggle class="clickable" hover-grow>
      <!-- Crystal Octahedron -->
      <a-octahedron 
        radius="0.8" 
        material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.75; roughness: 0.1; metalness: 0.9"
        animation="property: rotation; to: 0 360 360; loop: true; dur: 10000; easing: linear"
        animation__bob="property: position; dir: alternate; to: 0 1.5 -4; loop: true; dur: 2000; easing: easeInOutSine">
      </a-octahedron>

      <!-- Inner Pulsing Core -->
      <a-sphere 
        radius="0.3" 
        material="color: #ffffff; emissive: #ffffff; emissiveIntensity: 1"
        animation="property: scale; dir: alternate; to: 1.25 1.25 1.25; loop: true; dur: 800">
      </a-sphere>

      <!-- Point light emitted by crystal -->
      <a-light type="point" color="#6366f1" intensity="2" distance="8"></a-light>

      <!-- Base Pedestal -->
      <a-cylinder position="0 -0.8 0" radius="1.2" height="0.4" material="color: #1e1b4b; roughness: 0.3; metalness: 0.8"></a-cylinder>
      <a-ring position="0 -0.59 0" rotation="-90 0 0" radius-inner="0.7" radius-outer="1.2" material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.8"></a-ring>

      <!-- Labels -->
      <a-text id="crystal-label" value="Indigo Core" position="0 -1.2 0" align="center" color="#818cf8" width="4" font="kelsonsans"></a-text>
      <a-text value="(Click to change color)" position="0 -1.5 0" align="center" color="#cbd5e1" width="2.6"></a-text>
    </a-entity>


    <!-- 2. Right Exhibit: Animated Companion Robot -->
    <a-entity 
      position="3.2 0 -3.5" 
      rotation="0 -35 0" 
      scale="0.75 0.75 0.75"
      gltf-model="#robot-gltf"
      animation-mixer="clip: Dance; loop: repeat;"
      robot-toggle
      class="clickable"
      hover-grow>
      
      <!-- Holographic Base -->
      <a-cylinder position="0 0 0" radius="1.2" height="0.08" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 0.6"></a-cylinder>
      <a-light type="point" position="0 1.5 0" color="#ec4899" intensity="1.5" distance="6"></a-light>

      <!-- Label -->
      <a-text id="robot-label" value="Robot: Dance" position="0 2.5 0" align="center" color="#f472b6" width="4.5" font="kelsonsans"></a-text>
      <a-text value="(Click to change animation)" position="0 2.1 0" align="center" color="#cbd5e1" width="3"></a-text>
    </a-entity>


    <!-- 3. Left Exhibit: Sci-Fi Damaged Helmet Relic -->
    <a-entity position="-3.2 1.2 -3.5" rotation="0 35 0" class="clickable" hover-grow>
      <a-gltf-model 
        src="#helmet-gltf" 
        scale="1.1 1.1 1.1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
      </a-gltf-model>

      <a-cylinder position="0 -0.7 0" radius="0.7" height="0.4" material="color: #0f172a; roughness: 0.3; metalness: 0.8"></a-cylinder>
      <a-ring position="0 -0.49 0" rotation="-90 0 0" radius-inner="0.4" radius-outer="0.7" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.8"></a-ring>

      <a-text value="Ancient Relic" position="0 1.1 0" align="center" color="#22d3ee" width="3.5" font="kelsonsans"></a-text>
    </a-entity>


    <!-- 4. Far Left Exhibit: Floating Astronaut Explorer -->
    <a-entity position="-5.5 0 -1" rotation="0 70 0" class="clickable" hover-grow>
      <a-gltf-model 
        src="#astro-gltf" 
        scale="0.85 0.85 0.85"
        animation__bob="property: position; dir: alternate; to: -5.5 0.25 -1; loop: true; dur: 2500; easing: easeInOutQuad">
      </a-gltf-model>

      <a-text value="Explorer Vanguard" position="0 2.4 0" align="center" color="#a855f7" width="3.5" font="kelsonsans"></a-text>
    </a-entity>


    <!-- 5. Background Orbiting Energy Rings -->
    <a-entity position="0 5 -12">
      <a-torus radius="6" radius-tubular="0.04" material="color: #818cf8; emissive: #818cf8; emissiveIntensity: 0.5" animation="property: rotation; to: 360 180 0; loop: true; dur: 20000; easing: linear"></a-torus>
      <a-torus radius="8" radius-tubular="0.03" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 0.4" animation="property: rotation; to: -360 360 180; loop: true; dur: 26000; easing: linear"></a-torus>
    </a-entity>

  </a-scene>

</body>
</html>
