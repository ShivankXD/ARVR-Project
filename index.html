<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Mall - AR/VR Shopping Experience</title>
    <style>
        /* ==========================================
           CSS STYLES - GLASSMORPHISM & UI
           ========================================== */
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff0055;
            --bg-dark: rgba(10, 10, 20, 0.6);
            --glass-light: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #b0b0cc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: var(--text-primary);
        }

        #app-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 10;
            transition: all 0.2s ease;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: var(--primary);
            box-shadow: 0 0 4px var(--primary);
        }
        #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        #crosshair::after { left: 50%; top: 0; height: 100%; width: 2px; transform: translateX(-50%); }
        #crosshair.active {
            transform: translate(-50%, -50%) scale(1.5);
        }
        #crosshair.active::before, #crosshair.active::after {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        /* Top Bar */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .glass-panel {
            background: var(--bg-dark);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px 16px;
            color: var(--text-primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #fps-counter { color: #00ff99; font-weight: bold; min-width: 80px; }
        #time-indicator { color: var(--primary); font-weight: bold; min-width: 80px;}
        #vr-button {
            cursor: pointer;
            font-weight: bold;
            border-color: var(--primary);
            color: var(--primary);
            transition: all 0.3s;
        }
        #vr-button:hover {
            background: var(--primary);
            color: #000;
        }

        /* Bottom Bar */
        #bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }
        .cart-icon, .wishlist-icon {
            font-size: 24px;
            position: relative;
        }
        .cart-count, .wishlist-count {
            position: absolute;
            top: -5px;
            right: -10px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* Minimap */
        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            z-index: 10;
        }
        #minimap {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        /* Product Card */
        #product-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 320px;
            background: rgba(15, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 242, 255, 0.2);
        }
        #product-card.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        #product-card.expanded {
            width: 380px;
        }

        .pc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .pc-brand {
            font-size: 12px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .pc-stock {
            font-size: 12px;
            background: #00ff99;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .pc-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .pc-price-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .pc-price { font-size: 20px; font-weight: bold; }
        .pc-discount { color: #00ff99; font-size: 14px; }
        .pc-rating { color: #ffcc00; font-size: 14px; margin-bottom: 15px; }
        
        .pc-image {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
            background: #222;
        }
        
        .pc-details {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .pc-sizes, .pc-colors {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .pc-size-badge {
            border: 1px solid var(--glass-border);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .pc-color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .pc-desc {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Action Buttons */
        .pc-actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin-top 0.4s ease;
        }
        #product-card.expanded .pc-actions {
            max-height: 200px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-cart { background: var(--primary); color: #000; box-shadow: 0 0 10px rgba(0, 242, 255, 0.4); }
        .btn-buy { background: var(--accent); color: white; box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
        .btn-wish { background: transparent; color: white; border: 1px solid white; }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Notification Toast */
        #toast {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #00ff99;
            color: #000;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 30;
            box-shadow: 0 5px 20px rgba(0, 255, 153, 0.4);
        }
        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* VR Notice */
        #vr-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: var(--bg-dark);
            padding: 20px;
            border-radius: 12px;
            display: none;
            z-index: 50;
        }
    </style>
</head>

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function createProductTexture(product) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Background
            const grd = ctx.createLinearGradient(0, 0, 512, 512);
            grd.addColorStop(0, '#1a1a2e');
            grd.addColorStop(1, '#16213e');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 512, 512);

            // Draw Product Silhouette based on type
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 6;
            ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
            
            ctx.beginPath();
            if (product.type === 'Shirt' || product.type === 'T-Shirt') {
                ctx.moveTo(150, 150); ctx.lineTo(200, 120); ctx.lineTo(300, 120); ctx.lineTo(350, 150);
                ctx.lineTo(380, 200); ctx.lineTo(350, 250); ctx.lineTo(350, 380); ctx.lineTo(150, 380);
                ctx.lineTo(150, 250); ctx.lineTo(120, 200); ctx.closePath();
            } else if (product.type === 'Jeans') {
                ctx.moveTo(180, 120); ctx.lineTo(320, 120); ctx.lineTo(340, 380); ctx.lineTo(260, 380);
                ctx.lineTo(250, 250); ctx.lineTo(240, 380); ctx.lineTo(160, 380); ctx.closePath();
            } else if (product.type === 'Shoes') {
                ctx.moveTo(100, 300); ctx.lineTo(150, 250); ctx.lineTo(300, 250); ctx.lineTo(380, 280);
                ctx.lineTo(400, 320); ctx.lineTo(100, 320); ctx.closePath();
            } else if (product.type === 'Watch') {
                ctx.arc(256, 256, 100, 0, Math.PI * 2);
                ctx.moveTo(200, 150); ctx.lineTo(200, 100); ctx.lineTo(312, 100); ctx.lineTo(312, 150);
                ctx.moveTo(200, 362); ctx.lineTo(200, 412); ctx.lineTo(312, 412); ctx.lineTo(312, 362);
            } else if (product.type === 'Bag') {
                ctx.moveTo(150, 200); ctx.lineTo(350, 200); ctx.lineTo(380, 400); ctx.lineTo(120, 400); ctx.closePath();
                ctx.moveTo(200, 200); ctx.quadraticCurveTo(256, 120, 312, 200);
            } else {
                ctx.arc(256, 256, 120, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.stroke();

            // Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(product.brand, 256, 450);
            ctx.font = '24px Arial';
            ctx.fillStyle = '#00f2ff';
            ctx.fillText(product.name, 256, 480);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // ==========================================
        // AUDIO MANAGER
        // ==========================================
        class AudioManager {
            constructor() {
                this.ctx = null;
                this.initialized = false;
                this.ambienceGain = null;
            }

            init() {
                if (this.initialized) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.initialized = true;
                this.startAmbience();
            }

            startAmbience() {
                if (!this.ctx) return;
                this.ambienceGain = this.ctx.createGain();
                this.ambienceGain.gain.value = 0.05;
                this.ambienceGain.connect(this.ctx.destination);
                
                // Brown noise generator for mall hum
                const bufferSize = 2 * this.ctx.sampleRate;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = output[i];
                    output[i] *= 3.5;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;
                noise.connect(this.ambienceGain);
                noise.start(0);
            }

            playHover() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.value = 880;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playClick() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.value = 1200;
                osc.type = 'square';
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playPurchase() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'triangle';
                    const t = this.ctx.currentTime + i * 0.1;
                    gain.gain.setValueAtTime(0.15, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                    osc.start(t);
                    osc.stop(t + 0.2);
                });
            }

            playFootstep() {
                if (!this.ctx) return;
                const noise = this.ctx.createBufferSource();
                const bufferSize = this.ctx.sampleRate * 0.1;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                }
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.08;
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
        }

        // ==========================================
        // UI MANAGER
        // ==========================================
        class UIManager {
            constructor(app) {
                this.app = app;
                this.crosshair = document.getElementById('crosshair');
                this.fpsCounter = document.getElementById('fps-counter');
                this.timeIndicator = document.getElementById('time-indicator');
                this.cartCount = document.getElementById('cart-count');
                this.wishlistCount = document.getElementById('wishlist-count');
                this.minimapCanvas = document.getElementById('minimap');
                this.minimapCtx = this.minimapCanvas.getContext('2d');
                
                this.productCard = document.getElementById('product-card');
                this.currentProduct = null;
                this.gazeTimer = 0;
                this.cardExpanded = false;

                this.setupButtons();
            }

            setupButtons() {
                document.getElementById('btn-cart').addEventListener('click', () => this.handleAction('cart'));
                document.getElementById('btn-buy').addEventListener('click', () => this.handleAction('buy'));
                document.getElementById('btn-wish').addEventListener('click', () => this.handleAction('wish'));
            }

            handleAction(type) {
                if (!this.currentProduct) return;
                this.app.audio.playPurchase();
                const toast = document.getElementById('toast');
                
                if (type === 'cart') {
                    this.app.cartItems++;
                    this.cartCount.innerText = this.app.cartItems;
                    toast.innerText = `Added ${this.currentProduct.name} to Cart!`;
                    toast.style.background = '#00f2ff';
                    toast.style.color = '#000';
                } else if (type === 'buy') {
                    toast.innerText = `Proceeding to checkout for ${this.currentProduct.name}!`;
                    toast.style.background = '#ff0055';
                    toast.style.color = '#fff';
                } else if (type === 'wish') {
                    this.app.wishlistItems++;
                    this.wishlistCount.innerText = this.app.wishlistItems;
                    toast.innerText = `Added ${this.currentProduct.name} to Wishlist!`;
                    toast.style.background = '#ff0055';
                    toast.style.color = '#fff';
                }

                toast.classList.add('visible');
                setTimeout(() => toast.classList.remove('visible'), 2000);
            }

            updateFPS(fps) {
                this.fpsCounter.innerText = `FPS: ${fps}`;
            }

            updateTime() {
                const now = new Date();
                const hours = now.getHours();
                const mins = now.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const h = hours % 12 || 12;
                this.timeIndicator.innerText = `${h}:${mins < 10 ? '0' + mins : mins} ${ampm}`;
            }

            updateMinimap(playerPos, playerRot) {
                const ctx = this.minimapCtx;
                const w = this.minimapCanvas.width;
                const h = this.minimapCanvas.height;
                ctx.clearRect(0, 0, w, h);

                // Draw mall boundary
                ctx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.strokeRect(10, 10, w - 20, h - 20);

                // Draw shops
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                this.app.mall.shopPositions.forEach(shop => {
                    const x = (shop.x / MALL_WIDTH) * (w - 20) + 10;
                    const z = (shop.z / MALL_DEPTH) * (h - 20) + 10;
                    const sw = (shop.w / MALL_WIDTH) * (w - 20);
                    const sh = (shop.d / MALL_DEPTH) * (h - 20);
                    ctx.fillRect(x - sw/2, z - sh/2, sw, sh);
                });

                // Draw escalators
                ctx.fillStyle = 'rgba(112, 0, 255, 0.5)';
                this.app.mall.escalators.forEach(esc => {
                    const x = (esc.x / MALL_WIDTH) * (w - 20) + 10;
                    const z = (esc.z / MALL_DEPTH) * (h - 20) + 10;
                    ctx.fillRect(x - 5, z - 10, 10, 20);
                });

                // Draw player
                const px = (playerPos.x / MALL_WIDTH) * (w - 20) + 10;
                const py = (playerPos.z / MALL_DEPTH) * (h - 20) + 10;
                
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(playerRot);
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(0, -6);
                ctx.lineTo(4, 4);
                ctx.lineTo(-4, 4);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }

            showProductCard(product, mesh) {
                this.currentProduct = product;
                this.productCard.classList.add('visible');
                
                document.getElementById('pc-brand').innerText = product.brand;
                document.getElementById('pc-stock').innerText = product.stock;
                document.getElementById('pc-stock').style.background = product.stock === 'In Stock' ? '#00ff99' : '#ffcc00';
                document.getElementById('pc-name').innerText = product.name;
                document.getElementById('pc-price').innerText = `₹${product.price.toLocaleString('en-IN')}`;
                document.getElementById('pc-discount').innerText = product.discount > 0 ? `${product.discount}% OFF` : '';
                document.getElementById('pc-rating').innerText = `★★★★★ ${product.rating}`;
                document.getElementById('pc-desc').innerText = product.desc;

                // Sizes
                const sizesDiv = document.getElementById('pc-sizes');
                sizesDiv.innerHTML = '<strong>Sizes:</strong> ';
                product.sizes.forEach(s => {
                    sizesDiv.innerHTML += `<span class="pc-size-badge">${s}</span>`;
                });

                // Colors
                const colorsDiv = document.getElementById('pc-colors');
                colorsDiv.innerHTML = '<strong>Colors:</strong> ';
                product.colors.forEach(c => {
                    colorsDiv.innerHTML += `<div class="pc-color-dot" style="background:${c}"></div>`;
                });

                // Image
                const imgCanvas = document.getElementById('pc-image');
                const imgCtx = imgCanvas.getContext('2d');
                imgCtx.drawImage(mesh.material.map.image, 0, 0, imgCanvas.width, imgCanvas.height);

                this.crosshair.classList.add('active');
                this.app.audio.playHover();
            }

            hideProductCard() {
                this.productCard.classList.remove('visible');
                this.productCard.classList.remove('expanded');
                this.cardExpanded = false;
                this.currentProduct = null;
                this.crosshair.classList.remove('active');
            }

            updateCardPosition(camera, mesh) {
                if (!this.currentProduct || !mesh) return;
                
                const vector = new THREE.Vector3();
                mesh.getWorldPosition(vector);
                vector.project(camera);

                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                
                // Offset to the right of the crosshair
                this.productCard.style.left = `${x + 180}px`;
                this.productCard.style.top = `${y}px`;
                this.productCard.style.transform = 'translate(0, -50%)';

                // Gaze timer logic
                this.gazeTimer += this.app.clock.getDelta();
                if (this.gazeTimer > 1.5 && !this.cardExpanded) {
                    this.productCard.classList.add('expanded');
                    this.cardExpanded = true;
                }
            }

            resetGazeTimer() {
                this.gazeTimer = 0;
                if (this.cardExpanded) {
                    this.productCard.classList.remove('expanded');
                    this.cardExpanded = false;
                }
            }
        }

        // ==========================================
        // PLAYER CONTROLS
        // ==========================================
        class PlayerControls {
            constructor(camera, domElement, app) {
                this.camera = camera;
                this.domElement = domElement;
                this.app = app;
                
                this.velocity = new THREE.Vector3();
                this.direction = new THREE.Vector3();
                this.moveForward = false;
                this.moveBackward = false;
                this.moveLeft = false;
                this.moveRight = false;
                this.canJump = false;
                
                this.euler = new THREE.Euler(0, 0, 0, 'YXZ');
                this.minPolarAngle = 0;
                this.maxPolarAngle = Math.PI;
                
                this.isLocked = false;
                this.isVR = false;
                
                this.raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 10);
                
                this.setupControls();
            }

            setupControls() {
                document.addEventListener('keydown', (e) => this.onKeyDown(e));
                document.addEventListener('keyup', (e) => this.onKeyUp(e));
                document.addEventListener('mousemove', (e) => this.onMouseMove(e));
                document.addEventListener('click', () => this.lock());
            }

            lock() {
                if (!this.isVR && !this.isLocked) {
                    this.domElement.requestPointerLock();
                }
            }

            setVRMode(isVR) {
                this.isVR = isVR;
                if (isVR) this.isLocked = true; // Simulate lock for raycasting
            }

            onMouseMove(event) {
                if (this.isLocked && !this.isVR) {
                    const movementX = event.movementX || 0;
                    const movementY = event.movementY || 0;
                    
                    this.euler.setFromQuaternion(this.camera.quaternion);
                    this.euler.y -= movementX * 0.002;
                    this.euler.x -= movementY * 0.002;
                    this.euler.x = Math.max(Math.PI / 2 - this.maxPolarAngle, Math.min(Math.PI / 2 - this.minPolarAngle, this.euler.x));
                    this.camera.quaternion.setFromEuler(this.euler);
                }
            }

            onKeyDown(event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': this.moveForward = true; break;
                    case 'KeyA': case 'ArrowLeft': this.moveLeft = true; break;
                    case 'KeyS': case 'ArrowDown': this.moveBackward = true; break;
                    case 'KeyD': case 'ArrowRight': this.moveRight = true; break;
                }
            }

            onKeyUp(event) {
                switch (event.code) {
                    case 'KeyW': case 'ArrowUp': this.moveForward = false; break;
                    case 'KeyA': case 'ArrowLeft': this.moveLeft = false; break;
                    case 'KeyS': case 'ArrowDown': this.moveBackward = false; break;
                    case 'KeyD': case 'ArrowRight': this.moveRight = false; break;
                }
            }

            update(delta, walls) {
                if (!this.isLocked && !this.isVR) return;

                const speed = 20.0;
                this.velocity.x -= this.velocity.x * 10.0 * delta;
                this.velocity.z -= this.velocity.z * 10.0 * delta;

                this.direction.z = Number(this.moveForward) - Number(this.moveBackward);
                this.direction.x = Number(this.moveRight) - Number(this.moveLeft);
                this.direction.normalize();

                if (this.moveForward || this.moveBackward) this.velocity.z -= this.direction.z * speed * delta;
                if (this.moveLeft || this.moveRight) this.velocity.x -= this.direction.x * speed * delta;

                // Collision detection
                const oldPos = this.camera.position.clone();
                this.camera.translateX(-this.velocity.x * delta);
                this.camera.translateZ(-this.velocity.z * delta);

                // Mall boundaries
                const halfW = MALL_WIDTH / 2 - 1;
                const halfD = MALL_DEPTH / 2 - 1;
                this.camera.position.x = Math.max(-halfW, Math.min(halfW, this.camera.position.x));
                this.camera.position.z = Math.max(-halfD, Math.min(halfD, this.camera.position.z));

                // Wall collision
                const playerRadius = 0.6;
                for (let wall of walls) {
                    const box = new THREE.Box3().setFromObject(wall);
                    if (this.camera.position.x > box.min.x - playerRadius && this.camera.position.x < box.max.x + playerRadius &&
                        this.camera.position.z > box.min.z - playerRadius && this.camera.position.z < box.max.z + playerRadius) {
                        this.camera.position.x = oldPos.x;
                        this.camera.position.z = oldPos.z;
                        break;
                    }
                }

                // Footstep audio
                if ((this.moveForward || this.moveBackward || this.moveLeft || this.moveRight) && Math.random() > 0.9) {
                    this.app.audio.playFootstep();
                }
                
                if (this.isVR) {
                    this.camera.position.y = 1.6; // Lock height in VR
                }
            }
        }

        // ==========================================
        // MALL BUILDER
        // ==========================================
        class MallBuilder {
            constructor(scene) {
                this.scene = scene;
                this.walls = [];
                this.products = [];
                this.npcs = [];
                this.shopPositions = [];
                this.escalators = [];
                this.ceilingLights = [];
                this.shelves = [];
            }

            build() {
                this.createFloor();
                this.createCeiling();
                this.createWalls();
                this.createShops();
                this.createEscalators();
                this.createPlants();
                this.createAmbientLighting();
            }

            createFloor() {
                const geometry = new THREE.PlaneGeometry(MALL_WIDTH, MALL_DEPTH);
                
                // Procedural reflective floor material
                const floorCanvas = document.createElement('canvas');
                floorCanvas.width = 512;
                floorCanvas.height = 512;
                const fCtx = floorCanvas.getContext('2d');
                fCtx.fillStyle = '#111111';
                fCtx.fillRect(0,0,512,512);
                for(let i=0; i<10; i++) {
                    fCtx.strokeStyle = '#222';
                    fCtx.lineWidth = 2;
                    fCtx.beginPath();
                    fCtx.moveTo(i*51.2, 0);
                    fCtx.lineTo(i*51.2, 512);
                    fCtx.moveTo(0, i*51.2);
                    fCtx.lineTo(512, i*51.2);
                    fCtx.stroke();
                }
                const floorTex = new THREE.CanvasTexture(floorCanvas);
                floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
                floorTex.repeat.set(8, 8);

                const material = new THREE.MeshStandardMaterial({
                    map: floorTex,
                    color: 0x333344,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const floor = new THREE.Mesh(geometry, material);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                this.scene.add(floor);
            }

            createCeiling() {
                const geometry = new THREE.PlaneGeometry(MALL_WIDTH, MALL_DEPTH);
                const material = new THREE.MeshStandardMaterial({ color: 0x0a0a12, roughness: 0.9 });
                const ceiling = new THREE.Mesh(geometry, material);
                ceiling.position.y = WALL_HEIGHT;
                ceiling.rotation.x = Math.PI / 2;
                this.scene.add(ceiling);

                // Ceiling lights grid
                const lightGeo = new THREE.PlaneGeometry(4, 4);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
                for(let x = -30; x <= 30; x += 10) {
                    for(let z = -30; z <= 30; z += 10) {
                        const light = new THREE.Mesh(lightGeo, lightMat);
                        light.position.set(x, WALL_HEIGHT - 0.1, z);
                        light.rotation.x = Math.PI / 2;
                        this.scene.add(light);
                        this.ceilingLights.push(light);
                        
                        // Actual light source
                        const ptLight = new THREE.PointLight(0x00ffff, 0.5, 15);
                        ptLight.position.set(x, WALL_HEIGHT - 1, z);
                        this.scene.add(ptLight);
                    }
                }
            }

            createWalls() {
                const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.1 });
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0x88ccff,
                    metalness: 0,
                    roughness: 0.1,
                    transmission: 0.9,
                    transparent: true,
                    opacity: 0.3,
                    ior: 1.5,
                    thickness: 0.5
                });

                // Outer walls
                const wall1 = new THREE.Mesh(new THREE.BoxGeometry(MALL_WIDTH, WALL_HEIGHT, 0.5), mat);
                wall1.position.set(0, WALL_HEIGHT/2, -MALL_DEPTH/2);
                this.scene.add(wall1); this.walls.push(wall1);

                const wall2 = wall1.clone();
                wall2.position.set(0, WALL_HEIGHT/2, MALL_DEPTH/2);
                this.scene.add(wall2); this.walls.push(wall2);

                const wall3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, WALL_HEIGHT, MALL_DEPTH), mat);
                wall3.position.set(-MALL_WIDTH/2, WALL_HEIGHT/2, 0);
                this.scene.add(wall3); this.walls.push(wall3);

                const wall4 = wall3.clone();
                wall4.position.set(MALL_WIDTH/2, WALL_HEIGHT/2, 0);
                this.scene.add(wall4); this.walls.push(wall4);
                
                // Glass partitions for shops
                for(let i=1; i<=4; i++) {
                    const glass = new THREE.Mesh(new THREE.BoxGeometry(15, 4, 0.2), glassMat);
                    glass.position.set(-20, 2, -MALL_DEPTH/2 + i*15 - 30);
                    this.scene.add(glass);
                }
            }

            createShops() {
                const shopCount = 8;
                const angleStep = (Math.PI * 2) / shopCount;
                const radius = 30;

                for (let i = 0; i < shopCount; i++) {
                    const angle = i * angleStep;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    
                    // Shop Back Wall
                    const shopMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.6 });
                    const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 0.5), shopMat);
                    backWall.position.set(x, 3, z);
                    backWall.lookAt(0, 3, 0);
                    this.scene.add(backWall);
                    this.walls.push(backWall);

                    // Shop Logo/Sign
                    const signCanvas = document.createElement('canvas');
                    signCanvas.width = 512; signCanvas.height = 128;
                    const sCtx = signCanvas.getContext('2d');
                    sCtx.fillStyle = '#000'; sCtx.fillRect(0,0,512,128);
                    sCtx.fillStyle = ['#00f2ff', '#7000ff', '#ff0055', '#00ff99', '#ffcc00'][i % 5];
                    sCtx.font = 'bold 80px Arial'; sCtx.textAlign = 'center';
                    sCtx.fillText(`SHOP ${i+1}`, 256, 90);
                    const signTex = new THREE.CanvasTexture(signCanvas);
                    const signMat = new THREE.MeshBasicMaterial({ map: signTex });
                    const sign = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), signMat);
                    sign.position.set(x * 0.9, 4.5, z * 0.9);
                    sign.lookAt(0, 4.5, 0);
                    this.scene.add(sign);

                    // Shelves and Products
                    this.createShopInterior(x, z, angle, i);
                    
                    this.shopPositions.push({ x: x, z: z, w: 12, d: 6 });
                }
            }

            createShopInterior(x, z, angle, shopIndex) {
                const numShelves = 3;
                const shelfMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.5, metalness: 0.5 });
                
                for (let i = 0; i < numShelves; i++) {
                    const offset = (i - 1) * 3.5;
                    const localX = x - Math.cos(angle) * 2 + Math.sin(angle) * offset;
                    const localZ = z - Math.sin(angle) * 2 - Math.cos(angle) * offset;
                    
                    // Shelf
                    const shelf = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 1), shelfMat);
                    shelf.position.set(localX, 1, localZ);
                    shelf.lookAt(x, 1, z); // Face center
                    shelf.castShadow = true;
                    shelf.receiveShadow = true;
                    this.scene.add(shelf);
                    this.shelves.push(shelf);

                    // Products on shelf
                    const prodIndex = (shopIndex * 3 + i) % PRODUCTS_DATA.length;
                    const productData = PRODUCTS_DATA[prodIndex];
                    
                    const tex = createProductTexture(productData);
                    const prodMat = new THREE.MeshStandardMaterial({ 
                        map: tex, 
                        roughness: 0.4, 
                        metalness: 0.6,
                        emissive: 0x000000
                    });
                    
                    // Different shapes based on product type
                    let geo;
                    if (productData.type === 'Watch') geo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 32);
                    else if (productData.type === 'Shoes') geo = new THREE.BoxGeometry(0.8, 0.4, 0.6);
                    else if (productData.type === 'Bag') geo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
                    else geo = new THREE.BoxGeometry(0.8, 1.2, 0.2);
                    
                    const product = new THREE.Mesh(geo, prodMat);
                    product.position.set(localX, 1.8, localZ);
                    product.lookAt(x, 1.8, z);
                    product.userData = { isProduct: true, data: productData, baseY: 1.8, baseRotation: product.rotation.y };
                    this.scene.add(product);
                    this.products.push(product);
                }
            }

            createEscalators() {
                const escMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.8 });
                const stepMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
                
                const positions = [{x: -10, z: 0}, {x: 10, z: 0}];
                
                positions.forEach(pos => {
                    // Base structure
                    const base = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 12), escMat);
                    base.position.set(pos.x, 1, pos.z);
                    this.scene.add(base);
                    this.walls.push(base);
                    
                    // Steps
                    for(let i=0; i<10; i++) {
                        const step = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.2, 1), stepMat);
                        step.position.set(pos.x, 2 + i*0.5, pos.z - 5 + i);
                        step.userData.isEscalatorStep = true;
                        step.userData.startZ = pos.z - 5 + i;
                        step.userData.startY = 2 + i*0.5;
                        step.userData.dir = pos.x < 0 ? 1 : -1;
                        this.scene.add(step);
                    }
                    
                    this.escalators.push(pos);
                });
            }

            createPlants() {
                const planMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 });
                const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d5c2d, roughness: 0.6 });
                
                for(let i=0; i<6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;
                    const r = 15;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    
                    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1, 8), planMat);
                    pot.position.set(x, 0.5, z);
                    this.scene.add(pot);
                    this.walls.push(pot);
                    
                    for(let j=0; j<5; j++) {
                        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.4, 2, 4), leafMat);
                        leaf.position.set(x + (Math.random()-0.5)*0.5, 1.5 + Math.random()*0.5, z + (Math.random()-0.5)*0.5);
                        leaf.rotation.set(Math.random()*0.5 - 0.25, Math.random()*Math.PI, Math.random()*0.5 - 0.25);
                        this.scene.add(leaf);
                    }
                }
            }

            createAmbientLighting() {
                const ambient = new THREE.AmbientLight(0x404060, 0.5);
                this.scene.add(ambient);

                const sunLight = new THREE.DirectionalLight(0xffffee, 0.8);
                sunLight.position.set(20, 40, 20);
                sunLight.castShadow = true;
                sunLight.shadow.mapSize.width = 2048;
                sunLight.shadow.mapSize.height = 2048;
                sunLight.shadow.camera.left = -50;
                sunLight.shadow.camera.right = 50;
                sunLight.shadow.camera.top = 50;
                sunLight.shadow.camera.bottom = -50;
                this.scene.add(sunLight);
                
                RectAreaLightUniformsLib.init();
                const rectLight = new THREE.RectAreaLight(0x00ffff, 5, 10, 10);
                rectLight.position.set(0, 10, 0);
                rectLight.lookAt(0, 0, 0);
                this.scene.add(rectLight);
            }
        }

        // ==========================================
        // NPC MANAGER
        // ==========================================
        class NPC {
            constructor(scene) {
                this.scene = scene;
                this.mesh = new THREE.Group();
                this.state = 'walking'; // walking, idle
                this.stateTimer = 0;
                this.target = new THREE.Vector3(
                    (Math.random() - 0.5) * 60,
                    0,
                    (Math.random() - 0.5) * 60
                );
                this.speed = 1 + Math.random() * 1.5;
                
                this.createMesh();
                this.scene.add(this.mesh);
            }

            createMesh() {
                const bodyMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.5, 0.5), roughness: 0.8 });
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
                
                const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 4, 8), bodyMat);
                body.position.y = 1.0;
                body.castShadow = true;
                this.mesh.add(body);
                
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), headMat);
                head.position.y = 1.8;
                head.castShadow = true;
                this.mesh.add(head);
                
                // Legs for animation
                const legGeo = new THREE.BoxGeometry(0.15, 0.6, 0.15);
                this.leg1 = new THREE.Mesh(legGeo, bodyMat);
                this.leg1.position.set(-0.12, 0.3, 0);
                this.leg1.castShadow = true;
                this.mesh.add(this.leg1);
                
                this.leg2 = new THREE.Mesh(legGeo, bodyMat);
                this.leg2.position.set(0.12, 0.3, 0);
                this.leg2.castShadow = true;
                this.mesh.add(this.leg2);
            }

            update(delta) {
                this.stateTimer -= delta;
                
                if (this.state === 'walking') {
                    const dir = new THREE.Vector3().subVectors(this.target, this.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();
                    
                    if (dist < 1 || this.stateTimer <= 0) {
                        this.state = 'idle';
                        this.stateTimer = 2 + Math.random() * 3;
                    } else {
                        dir.normalize();
                        this.mesh.position.addScaledVector(dir, this.speed * delta);
                        this.mesh.lookAt(this.target.x, this.mesh.position.y, this.target.z);
                        
                        // Leg animation
                        const t = performance.now() * 0.01 * this.speed;
                        this.leg1.rotation.x = Math.sin(t) * 0.5;
                        this.leg2.rotation.x = -Math.sin(t) * 0.5;
                    }
                } else {
                    if (this.stateTimer <= 0) {
                        this.state = 'walking';
                        this.stateTimer = 5 + Math.random() * 5;
                        this.target.set(
                            (Math.random() - 0.5) * 60,
                            0,
                            (Math.random() - 0.5) * 60
                        );
                    }
                }
            }
        }

        // ==========================================
        // MAIN APPLICATION
        // ==========================================
        class App {
            constructor() {
                this.container = document.getElementById('app-container');
                this.clock = new THREE.Clock();
                this.cartItems = 0;
                this.wishlistItems = 0;
                this.fps = 60;
                this.frames = 0;
                this.prevTime = performance.now();
                
                this.init();
            }

            init() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x05050a);
                this.scene.fog = new THREE.Fog(0x05050a, 30, 80);
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
                this.camera.position.set(0, 1.6, 25);
                
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.container.appendChild(this.renderer.domElement);
                
                // Post Processing
                this.setupPostProcessing();
                
                // Components
                this.audio = new AudioManager();
                this.ui = new UIManager(this);
                this.mall = new MallBuilder(this.scene);
                this.mall.build();
                
                // NPCs
                this.npcs = [];
                for(let i=0; i<10; i++) {
                    this.npcs.push(new NPC(this.scene));
                }
                
                // Controls
                this.controls = new PlayerControls(this.camera, document.body, this);
                
                // Raycaster for product interaction
                this.raycaster = new THREE.Raycaster();
                this.centerVec = new THREE.Vector2(0, 0);
                this.currentLookedObject = null;
                
                // VR Setup
                this.setupVR();
                
                // Events
                window.addEventListener('resize', () => this.onWindowResize());
                document.addEventListener('pointerlockchange', () => {
                    this.controls.isLocked = (document.pointerLockElement !== null);
                });

                // Hide loading screen
                document.getElementById('loading-screen').classList.add('hidden');
                
                // Start animation loop
                this.renderer.setAnimationLoop(() => this.animate());
                
                // UI updates
                setInterval(() => this.ui.updateTime(), 1000);
                this.ui.updateTime();
            }

            setupPostProcessing() {
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                
                const bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.6, // strength
                    0.4, // radius
                    0.85 // threshold
                );
                this.composer.addPass(bloomPass);
                
                const fxaaPass = new ShaderPass(FXAAShader);
                const pixelRatio = this.renderer.getPixelRatio();
                fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
                fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
                this.composer.addPass(fxaaPass);
            }

            setupVR() {
                this.renderer.xr.enabled = true;
                document.getElementById('vr-button').style.display = 'none';
                
                if ('xr' in navigator) {
                    navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                        if (supported) {
                            const vrBtn = document.getElementById('vr-button');
                            vrBtn.style.display = 'flex';
                            vrBtn.addEventListener('click', () => {
                                navigator.xr.requestSession('immersive-vr', { 
                                    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] 
                                }).then((session) => {
                                    this.renderer.xr.setSession(session);
                                    this.controls.setVRMode(true);
                                    document.getElementById('vr-notice').style.display = 'block';
                                    setTimeout(() => {
                                        document.getElementById('vr-notice').style.display = 'none';
                                    }, 3000);
                                });
                            });
                        }
                    });
                }
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
            }

            handleProductInteraction() {
                this.raycaster.setFromCamera(this.centerVec, this.camera);
                const intersects = this.raycaster.intersectObjects(this.mall.products);
                
                if (intersects.length > 0 && intersects[0].distance < 8) {
                    const obj = intersects[0].object;
                    
                    if (this.currentLookedObject !== obj) {
                        // Reset previous
                        if (this.currentLookedObject) {
                            this.currentLookedObject.material.emissive.setHex(0x000000);
                        }
                        // Highlight new
                        this.currentLookedObject = obj;
                        obj.material.emissive.setHex(0x00ffff);
                        obj.material.emissiveIntensity = 0.5;
                        
                        this.ui.showProductCard(obj.userData.data, obj);
                        this.ui.resetGazeTimer();
                    } else {
                        // Still looking at same object
                        this.ui.updateCardPosition(this.camera, obj);
                        
                        // Animate product
                        obj.position.y = obj.userData.baseY + Math.sin(this.clock.getElapsedTime() * 2) * 0.1;
                        obj.rotation.y += 0.01;
                    }
                } else {
                    // Not looking at anything
                    if (this.currentLookedObject) {
                        this.currentLookedObject.material.emissive.setHex(0x000000);
                        this.currentLookedObject.position.y = this.currentLookedObject.userData.baseY;
                        this.currentLookedObject = null;
                        this.ui.hideProductCard();
                    }
                }
            }

            animateEscalators() {
                this.scene.traverse(obj => {
                    if (obj.userData.isEscalatorStep) {
                        obj.position.z += obj.userData.dir * 0.02;
                        obj.position.y += obj.userData.dir * 0.01;
                        
                        if (obj.userData.dir > 0 && obj.position.z > obj.userData.startZ + 10) {
                            obj.position.z = obj.userData.startZ;
                            obj.position.y = obj.userData.startY;
                        } else if (obj.userData.dir < 0 && obj.position.z < obj.userData.startZ - 10) {
                            obj.position.z = obj.userData.startZ;
                            obj.position.y = obj.userData.startY;
                        }
                    }
                });
            }

            animate() {
                const delta = this.clock.getDelta();
                
                // FPS calculation
                this.frames++;
                const time = performance.now();
                if (time >= this.prevTime + 1000) {
                    this.fps = Math.round((this.frames * 1000) / (time - this.prevTime));
                    this.ui.updateFPS(this.fps);
                    this.prevTime = time;
                    this.frames = 0;
                }
                
                // Update controls
                this.controls.update(delta, this.mall.walls);
                
                // Update NPCs
                this.npcs.forEach(npc => npc.update(delta));
                
                // Animate escalators
                this.animateEscalators();
                
                // Product interaction
                this.handleProductInteraction();
                
                // Ceiling light flicker effect
                this.mall.ceilingLights.forEach(light => {
                    light.material.opacity = 0.7 + Math.sin(this.clock.getElapsedTime() * 2 + light.position.x) * 0.1;
                });
                
                // Update minimap
                this.ui.updateMinimap(this.camera.position, this.controls.euler.y);
                
                // Render
                if (this.renderer.xr.isPresenting) {
                    this.renderer.render(this.scene, this.camera);
                } else {
                    this.composer.render();
                }
            }
        }

        // Initialize App
        const app = new App();
        
        // Initialize audio on first user interaction
        document.addEventListener('click', () => app.audio.init(), { once: true });
        document.addEventListener('keydown', () => app.audio.init(), { once: true });

    </script>
</body>
