<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aetheria — Crystal Temple VR World | Meta Quest 3</title>
  <meta name="description" content="Aetheria: A cyberpunk crystal temple VR world for Meta Quest 3 built with A-Frame.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', system-ui, sans-serif; }

    #hud {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(6, 8, 20, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 40px;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(255,255,255,0.07);
      pointer-events: none;
    }

    .hud-key {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .hud-key kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 0.7rem;
      color: #e2e8f0;
      font-family: monospace;
    }

    .hud-divider { width: 1px; height: 16px; background: rgba(255,255,255,0.12); }

    #world-title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      text-align: center;
      pointer-events: none;
    }

    #world-title h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(to right, #818cf8, #f472b6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 3px;
    }

    #world-title p {
      font-size: 0.72rem;
      color: rgba(148, 163, 184, 0.8);
      margin: 0;
      letter-spacing: 0.06em;
    }

    .a-enter-vr-button {
      background: linear-gradient(135deg, #6366f1, #ec4899) !important;
      border-radius: 12px !important;
      border: none !important;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6) !important;
      transition: all 0.3s ease !important;
    }
    .a-enter-vr-button:hover {
      transform: scale(1.08) !important;
      filter: brightness(1.15) !important;
    }
  </style>

  <script>
    // Web Audio Synth
    const SFX = {
      ctx: null,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      tone(freq, type = 'sine', dur = 0.5, vol = 0.18) {
        try {
          this.init();
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = type; o.frequency.value = freq;
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(); o.stop(this.ctx.currentTime + dur);
        } catch(e) {}
      },
      chime() { [523, 659, 784, 1047].forEach((f,i) => setTimeout(()=>this.tone(f,'sine',0.4,0.15),i*70)); },
      portal() { this.tone(200,'sawtooth',0.4,0.15); setTimeout(()=>this.tone(400,'sine',0.3,0.12),200); },
      orb() { this.tone(1200,'triangle',0.25,0.1); }
    };

    // Crystal Color Cycle
    AFRAME.registerComponent('crystal-color', {
      init() {
        const hues = ['#6366f1','#ec4899','#06b6d4','#10b981','#f59e0b','#a855f7','#ef4444'];
        const names = ['Indigo Storm','Neon Magenta','Cyan Plasma','Emerald Aura','Solar Amber','Arcane Violet','Crimson Blaze'];
        let i = 0;
        this.el.addEventListener('click', () => {
          i = (i+1) % hues.length;
          const h = hues[i];
          this.el.querySelectorAll('[data-crystal]').forEach(m => {
            m.setAttribute('material', `color: ${h}; emissive: ${h}; emissiveIntensity: 0.8; roughness: 0.05; metalness: 0.9; wireframe: false`);
          });
          this.el.querySelectorAll('[data-clight]').forEach(l => l.setAttribute('color', h));
          const lbl = document.querySelector('#crystal-name');
          if (lbl) lbl.setAttribute('value', names[i]);
          SFX.chime();
        });
      }
    });

    // Portal Realm Switcher
    AFRAME.registerComponent('realm-portal', {
      init() {
        const realms = [
          { sky1: '#0a0a2e', sky2: '#1a0a3e', name: 'Nebula Void', fog: '#060012' },
          { sky1: '#0d1117', sky2: '#0d2818', name: 'Emerald Nebula', fog: '#001a08' },
          { sky1: '#1a0a00', sky2: '#3d1200', name: 'Solar Forge', fog: '#1a0500' },
          { sky1: '#001a2e', sky2: '#002e4a', name: 'Deep Ocean', fog: '#000d17' },
          { sky1: '#1a001a', sky2: '#2e0033', name: 'Void Rift', fog: '#0d000d' }
        ];
        let i = 0;
        this.el.addEventListener('click', () => {
          i = (i+1) % realms.length;
          const r = realms[i];
          const sky = document.querySelector('#main-sky');
          if (sky) {
            sky.setAttribute('material', `color: ${r.sky2}; shader: flat`);
          }
          const atm = document.querySelector('#atm-gradient');
          if (atm) atm.setAttribute('material', `color: ${r.sky1}; shader: flat; opacity: 0.95; transparent: true`);
          const lbl = document.querySelector('#portal-realm-name');
          if (lbl) lbl.setAttribute('value', r.name);
          SFX.portal();
        });
      }
    });

    // Energy Orb Interaction
    AFRAME.registerComponent('energy-orb', {
      init() {
        let scale = 1;
        this.el.addEventListener('click', () => {
          scale = scale === 1 ? 1.5 : 1;
          this.el.setAttribute('animation__pulse', `property: scale; to: ${scale*1.2} ${scale*1.2} ${scale*1.2}; dir: alternate; loop: true; dur: 600; easing: easeInOutSine`);
          SFX.orb();
        });
      }
    });

    // Hover Glow
    AFRAME.registerComponent('hover-glow', {
      init() {
        const el = this.el;
        const orig = el.getAttribute('scale') || {x:1,y:1,z:1};
        el.addEventListener('mouseenter', () => {
          el.setAttribute('animation__hg', `property: scale; to: ${orig.x*1.08} ${orig.y*1.08} ${orig.z*1.08}; dur: 180; easing: easeOutQuad`);
          SFX.tone(880,'sine',0.15,0.08);
        });
        el.addEventListener('mouseleave', () => {
          el.setAttribute('animation__hg', `property: scale; to: ${orig.x} ${orig.y} ${orig.z}; dur: 220; easing: easeOutQuad`);
        });
      }
    });
  </script>
</head>
<body>

  <!-- Minimal bottom HUD -->
  <div id="hud">
    <span class="hud-key"><kbd>WASD</kbd> Move</span>
    <div class="hud-divider"></div>
    <span class="hud-key"><kbd>Mouse</kbd> Look</span>
    <div class="hud-divider"></div>
    <span class="hud-key"><kbd>Click</kbd> Interact</span>
    <div class="hud-divider"></div>
    <span class="hud-key" style="color:#818cf8">● A-Frame 1.7.1 · Meta Quest 3 Ready</span>
  </div>

  <!-- World Title -->
  <div id="world-title">
    <h1>Aetheria</h1>
    <p>Crystal Temple VR World · Meta Quest 3</p>
  </div>

  <a-scene
    fog="type: exponential; color: #060012; density: 0.018"
    renderer="antialias: true; colorManagement: true; exposure: 1.0; highRefreshRate: true; physicallyCorrectLights: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- =========== ASSETS =========== -->
    <a-assets>
      <a-asset-item id="robot-model" src="https://modelviewer.dev/shared-assets/models/robot.glb" response-type="arraybuffer"></a-asset-item>
      <a-asset-item id="astronaut-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" response-type="arraybuffer"></a-asset-item>
    </a-assets>

    <!-- =========== SKY & ATMOSPHERE =========== -->
    <!-- Gradient Sky (two layered spheres) -->
    <a-sphere id="main-sky" radius="300" material="color: #1a0a3e; shader: flat; side: back"></a-sphere>
    <a-sphere id="atm-gradient" radius="280" material="color: #0a0a2e; shader: flat; side: back; opacity: 0.95; transparent: true"></a-sphere>

    <!-- Stars (small glowing spheres scattered high up) -->
    <a-entity id="stars">
      <!-- Star cluster 1 -->
      <a-sphere position="40 80 -200" radius="0.4" material="color:#fff; emissive:#fff; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="-80 100 -180" radius="0.3" material="color:#c7d2fe; emissive:#c7d2fe; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="120 90 -160" radius="0.5" material="color:#fbcfe8; emissive:#fbcfe8; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="-150 120 -220" radius="0.4" material="color:#bae6fd; emissive:#bae6fd; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="60 110 -250" radius="0.6" material="color:#fff; emissive:#fff; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="-30 140 -200" radius="0.3" material="color:#ddd6fe; emissive:#ddd6fe; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="200 85 -190" radius="0.4" material="color:#fff; emissive:#fff; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="-100 95 -240" radius="0.35" material="color:#c7d2fe; emissive:#c7d2fe; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="180 130 -210" radius="0.5" material="color:#fbcfe8; emissive:#fbcfe8; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="-200 110 -170" radius="0.4" material="color:#bae6fd; emissive:#bae6fd; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="90 160 -230" radius="0.3" material="color:#fff; emissive:#fff; emissiveIntensity:1; shader:flat"></a-sphere>
      <a-sphere position="-60 75 -190" radius="0.45" material="color:#c7d2fe; emissive:#c7d2fe; emissiveIntensity:1; shader:flat"></a-sphere>
    </a-entity>

    <!-- Distant nebula rings (far background art) -->
    <a-torus position="0 30 -250" radius="90" radius-tubular="8" rotation="75 0 30"
      material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.15; opacity:0.25; transparent:true; shader:flat; side:double">
    </a-torus>
    <a-torus position="60 20 -240" radius="70" radius-tubular="6" rotation="60 20 0"
      material="color:#ec4899; emissive:#ec4899; emissiveIntensity:0.12; opacity:0.2; transparent:true; shader:flat; side:double">
    </a-torus>

    <!-- =========== GROUND PLANE =========== -->
    <!-- Base ground -->
    <a-plane
      position="0 0 0" rotation="-90 0 0" width="300" height="300"
      material="color:#07040f; roughness:0.9; metalness:0.1">
    </a-plane>

    <!-- Glowing grid overlay -->
    <a-plane
      position="0 0.02 0" rotation="-90 0 0" width="120" height="120"
      material="color:#1a0a3e; emissive:#6366f1; emissiveIntensity:0.08; roughness:1; repeat:30 30; wireframe:true; opacity:0.4; transparent:true">
    </a-plane>

    <!-- =========== CENTRAL TEMPLE COMPLEX =========== -->

    <!-- Grand elevated platform base -->
    <a-cylinder position="0 0.3 -8" radius="14" height="0.6"
      material="color:#0d0b1f; roughness:0.3; metalness:0.7">
    </a-cylinder>
    <a-cylinder position="0 0.2 -8" radius="14.2" height="0.2"
      material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.5; roughness:0.1">
    </a-cylinder>

    <!-- Mid platform ring -->
    <a-cylinder position="0 0.7 -8" radius="9" height="0.5"
      material="color:#110e22; roughness:0.3; metalness:0.8">
    </a-cylinder>
    <a-cylinder position="0 0.62 -8" radius="9.15" height="0.15"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.6; roughness:0.1">
    </a-cylinder>

    <!-- Inner altar platform -->
    <a-cylinder position="0 1.1 -8" radius="5" height="0.8"
      material="color:#1a1440; roughness:0.2; metalness:0.9">
    </a-cylinder>
    <a-cylinder position="0 1.01 -8" radius="5.15" height="0.12"
      material="color:#a855f7; emissive:#a855f7; emissiveIntensity:0.8; roughness:0.05">
    </a-cylinder>

    <!-- Temple floor pattern: glowing concentric rings on altar -->
    <a-ring position="0 1.52 -8" rotation="-90 0 0" radius-inner="1.5" radius-outer="1.55"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:1; shader:flat">
    </a-ring>
    <a-ring position="0 1.52 -8" rotation="-90 0 0" radius-inner="2.8" radius-outer="2.85"
      material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.7; shader:flat">
    </a-ring>
    <a-ring position="0 1.52 -8" rotation="-90 0 0" radius-inner="4" radius-outer="4.04"
      material="color:#4f46e5; emissive:#4f46e5; emissiveIntensity:0.5; shader:flat">
    </a-ring>

    <!-- =========== GRAND ENTRY ARCH =========== -->
    <!-- Left pillar -->
    <a-cylinder position="-4 4 1" radius="0.5" height="8"
      material="color:#1e1b4b; roughness:0.2; metalness:0.8">
    </a-cylinder>
    <a-cylinder position="-4 8.2 1" radius="0.7" height="0.4"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.7">
    </a-cylinder>
    <a-cylinder position="-4 0.2 1" radius="0.7" height="0.4"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.7">
    </a-cylinder>
    <a-light type="point" position="-4 8.5 1" color="#818cf8" intensity="1" distance="8"></a-light>

    <!-- Right pillar -->
    <a-cylinder position="4 4 1" radius="0.5" height="8"
      material="color:#1e1b4b; roughness:0.2; metalness:0.8">
    </a-cylinder>
    <a-cylinder position="4 8.2 1" radius="0.7" height="0.4"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.7">
    </a-cylinder>
    <a-cylinder position="4 0.2 1" radius="0.7" height="0.4"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.7">
    </a-cylinder>
    <a-light type="point" position="4 8.5 1" color="#818cf8" intensity="1" distance="8"></a-light>

    <!-- Arch crossbar -->
    <a-box position="0 8.3 1" width="8" height="0.6" depth="0.8"
      material="color:#1e1b4b; roughness:0.2; metalness:0.8">
    </a-box>
    <a-box position="0 8.65 1" width="8.2" height="0.08" depth="0.85"
      material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.9">
    </a-box>

    <!-- Arch rune text  -->
    <a-text value="AETHERIA" position="0 8.3 1.45" align="center" color="#c7d2fe" width="4" font="kelsonsans"></a-text>

    <!-- Arch steps -->
    <a-box position="0 0.12 2" width="10" height="0.24" depth="1.2" material="color:#1e1b4b; metalness:0.6"></a-box>
    <a-box position="0 0.36 1.4" width="9.2" height="0.24" depth="0.8" material="color:#2d2a5e; metalness:0.6"></a-box>

    <!-- =========== 8 ENERGY PILLARS around outer platform =========== -->
    <!-- Pillar macro: cylinder + glowing cap + point light, at 8 positions on radius ~12 -->
    <!-- North -->
    <a-entity position="0 0 -20">
      <a-cylinder radius="0.6" height="6" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 3.2 0" radius="0.8" height="0.3" material="color:#6366f1; emissive:#6366f1; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 3.5 0" color="#6366f1" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- NE -->
    <a-entity position="8.5 0 -17">
      <a-cylinder radius="0.6" height="7" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 3.7 0" radius="0.8" height="0.3" material="color:#ec4899; emissive:#ec4899; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 4 0" color="#ec4899" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- East -->
    <a-entity position="13 0 -8">
      <a-cylinder radius="0.6" height="5" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 2.7 0" radius="0.8" height="0.3" material="color:#06b6d4; emissive:#06b6d4; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 3 0" color="#06b6d4" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- SE -->
    <a-entity position="8.5 0 1">
      <a-cylinder radius="0.6" height="6" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 3.2 0" radius="0.8" height="0.3" material="color:#10b981; emissive:#10b981; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 3.5 0" color="#10b981" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- NW -->
    <a-entity position="-8.5 0 -17">
      <a-cylinder radius="0.6" height="7" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 3.7 0" radius="0.8" height="0.3" material="color:#f59e0b; emissive:#f59e0b; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 4 0" color="#f59e0b" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- West -->
    <a-entity position="-13 0 -8">
      <a-cylinder radius="0.6" height="5" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 2.7 0" radius="0.8" height="0.3" material="color:#a855f7; emissive:#a855f7; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 3 0" color="#a855f7" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- SW -->
    <a-entity position="-8.5 0 1">
      <a-cylinder radius="0.6" height="6" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 3.2 0" radius="0.8" height="0.3" material="color:#ef4444; emissive:#ef4444; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 3.5 0" color="#ef4444" intensity="1.5" distance="10"></a-light>
    </a-entity>
    <!-- NorthExtra -->
    <a-entity position="0 0 4">
      <a-cylinder radius="0.5" height="4.5" material="color:#1e1b4b; roughness:0.2; metalness:0.85"></a-cylinder>
      <a-cylinder position="0 2.5 0" radius="0.7" height="0.25" material="color:#818cf8; emissive:#818cf8; emissiveIntensity:1"></a-cylinder>
      <a-light type="point" position="0 2.7 0" color="#818cf8" intensity="1.2" distance="8"></a-light>
    </a-entity>

    <!-- =========== CENTRAL GRAND CRYSTAL SPIRE =========== -->
    <a-entity position="0 1.5 -8" crystal-color class="clickable" hover-glow>

      <!-- Main spire shaft -->
      <a-cone data-crystal
        radius-bottom="0.5" radius-top="0.05" height="7"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.8; roughness:0.05; metalness:0.9"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear">
      </a-cone>

      <!-- Mid shard -->
      <a-cone data-crystal
        position="0.4 2 0" rotation="0 0 25"
        radius-bottom="0.25" radius-top="0.02" height="3.5"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.8; roughness:0.05; metalness:0.9"
        animation="property: rotation; to: 360 0 25; loop: true; dur: 14000; easing: linear">
      </a-cone>
      <a-cone data-crystal
        position="-0.4 1.5 0" rotation="0 0 -20"
        radius-bottom="0.2" radius-top="0.02" height="3"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.8; roughness:0.05; metalness:0.9"
        animation="property: rotation; to: -360 0 -20; loop: true; dur: 16000; easing: linear">
      </a-cone>
      <a-cone data-crystal
        position="0 1 0.4" rotation="15 0 0"
        radius-bottom="0.22" radius-top="0.02" height="2.8"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.8; roughness:0.05; metalness:0.9">
      </a-cone>

      <!-- Core glowing orb at base of spire -->
      <a-sphere data-crystal radius="0.7"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:1; roughness:0; metalness:1; opacity:0.9; transparent:true"
        animation="property: scale; dir: alternate; to: 1.15 1.15 1.15; loop: true; dur: 1200; easing: easeInOutSine">
      </a-sphere>

      <!-- Crystal point lights -->
      <a-light data-clight type="point" color="#6366f1" intensity="4" distance="16"></a-light>
      <a-light data-clight type="point" position="0 4 0" color="#6366f1" intensity="2.5" distance="12"></a-light>

      <!-- Rotating orbital rings -->
      <a-torus position="0 2 0" radius="2.2" radius-tubular="0.04"
        material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.8"
        animation="property: rotation; to: 360 0 0; loop: true; dur: 8000; easing: linear">
      </a-torus>
      <a-torus position="0 2 0" radius="2.5" radius-tubular="0.03"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.6"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 11000; easing: linear">
      </a-torus>
      <a-torus position="0 2 0" radius="2.8" radius-tubular="0.025"
        material="color:#4f46e5; emissive:#4f46e5; emissiveIntensity:0.5"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 15000; easing: linear">
      </a-torus>

      <!-- Floating text label (world-space, not a sign box) -->
      <a-text id="crystal-name" value="Indigo Storm"
        position="0 -1.3 0" align="center" color="#c7d2fe" width="6"
        font="kelsonsans">
      </a-text>
      <a-text value="Tap to cycle" position="0 -1.65 0" align="center" color="#6366f1" width="4" font="kelsonsans"></a-text>
    </a-entity>

    <!-- =========== REALM PORTAL (Left, facing inward) =========== -->
    <a-entity position="-9 1.5 -8" rotation="0 35 0" realm-portal class="clickable" hover-glow>
      <!-- Portal frame outer -->
      <a-torus radius="2.2" radius-tubular="0.18"
        material="color:#06b6d4; emissive:#06b6d4; emissiveIntensity:1; roughness:0.1; metalness:0.9"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 20000; easing: linear">
      </a-torus>

      <!-- Inner spinning smaller ring -->
      <a-torus radius="1.8" radius-tubular="0.08"
        material="color:#3b82f6; emissive:#3b82f6; emissiveIntensity:0.8"
        animation="property: rotation; to: 0 0 -360; loop: true; dur: 8000; easing: linear">
      </a-torus>

      <!-- Portal void disc -->
      <a-circle radius="1.75"
        material="color:#020617; emissive:#0c1445; emissiveIntensity:0.5; side:double; opacity:0.92; transparent:true"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 15000; easing: linear">
      </a-circle>

      <!-- Animated energy particles floating through portal -->
      <a-sphere position="0 0 0.1" radius="0.12"
        material="color:#38bdf8; emissive:#38bdf8; emissiveIntensity:1; shader:flat"
        animation="property: position; from: -0.8 -0.8 0.1; to: 0.8 0.8 0.1; loop: true; dur: 2000; easing: easeInOutSine; dir: alternate">
      </a-sphere>
      <a-sphere position="0 0 0.1" radius="0.08"
        material="color:#818cf8; emissive:#818cf8; emissiveIntensity:1; shader:flat"
        animation="property: position; from: 0.6 -0.6 0.1; to: -0.6 0.6 0.1; loop: true; dur: 2800; easing: easeInOutSine; dir: alternate">
      </a-sphere>

      <!-- Ambient glow from portal -->
      <a-light type="point" color="#06b6d4" intensity="2" distance="8"></a-light>

      <!-- World-space label -->
      <a-text id="portal-realm-name" value="Nebula Void" position="0 -2.8 0" align="center" color="#38bdf8" width="5" font="kelsonsans"></a-text>
      <a-text value="Portal · Tap to switch realm" position="0 -3.2 0" align="center" color="#0ea5e9" width="4" font="kelsonsans"></a-text>
    </a-entity>

    <!-- =========== ENERGY ORB SHRINE (Right side) =========== -->
    <a-entity position="9 1.5 -8">
      <!-- Shrine altar box -->
      <a-box position="0 -0.9 0" width="2.5" height="1.8" depth="2.5"
        material="color:#110e22; roughness:0.3; metalness:0.8">
      </a-box>
      <a-box position="0 0.02 0" width="2.7" height="0.1" depth="2.7"
        material="color:#a855f7; emissive:#a855f7; emissiveIntensity:0.5">
      </a-box>

      <!-- Side altar spires -->
      <a-cone position="-0.8 0.8 0" radius-bottom="0.15" radius-top="0.02" height="1.6"
        material="color:#a855f7; emissive:#a855f7; emissiveIntensity:0.6">
      </a-cone>
      <a-cone position="0.8 0.8 0" radius-bottom="0.15" radius-top="0.02" height="1.6"
        material="color:#a855f7; emissive:#a855f7; emissiveIntensity:0.6">
      </a-cone>

      <!-- Large orbiting energy orb -->
      <a-sphere class="clickable" energy-orb hover-glow radius="0.9"
        material="color:#a855f7; emissive:#a855f7; emissiveIntensity:0.7; roughness:0.05; metalness:0.9; opacity:0.88; transparent:true"
        animation="property: position; from: 9 2.4 -8; to: 9 2.9 -8; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
      </a-sphere>
      <a-light type="point" position="0 1.5 0" color="#a855f7" intensity="2.5" distance="10"></a-light>

      <!-- Shrine label -->
      <a-text value="Arcane Shrine" position="0 2.8 0" align="center" color="#d8b4fe" width="5" font="kelsonsans"></a-text>
      <a-text value="Tap orb to activate" position="0 2.44 0" align="center" color="#a855f7" width="4" font="kelsonsans"></a-text>
    </a-entity>

    <!-- =========== ASTRONAUT EXPLORER (Far left alcove) =========== -->
    <a-entity position="-6 0 1">
      <!-- Alcove base -->
      <a-cylinder position="0 0.15 0" radius="1.8" height="0.3"
        material="color:#1e1b4b; metalness:0.7">
      </a-cylinder>
      <a-cylinder position="0 0.06 0" radius="1.85" height="0.12"
        material="color:#06b6d4; emissive:#06b6d4; emissiveIntensity:0.6">
      </a-cylinder>

      <!-- Astronaut model -->
      <a-entity gltf-model="#astronaut-model" scale="0.95 0.95 0.95" position="0 0.3 0" rotation="0 50 0"
        class="clickable" hover-glow
        animation="property: position; dir: alternate; from: -6 0.3 1; to: -6 0.5 1; loop: true; dur: 2600; easing: easeInOutSine">
      </a-entity>

      <a-light type="point" position="0 2.5 0" color="#38bdf8" intensity="1.2" distance="6"></a-light>
      <a-text value="Explorer Vanguard" position="0 2.6 0" align="center" color="#38bdf8" width="5" font="kelsonsans"></a-text>
    </a-entity>

    <!-- =========== COMPANION ROBOT (Far right alcove) =========== -->
    <a-entity position="6 0 1">
      <!-- Alcove base -->
      <a-cylinder position="0 0.15 0" radius="1.8" height="0.3"
        material="color:#1e1b4b; metalness:0.7">
      </a-cylinder>
      <a-cylinder position="0 0.06 0" radius="1.85" height="0.12"
        material="color:#ec4899; emissive:#ec4899; emissiveIntensity:0.6">
      </a-cylinder>

      <!-- Robot model -->
      <a-entity gltf-model="#robot-model" scale="0.75 0.75 0.75" position="0 0.3 0" rotation="0 -50 0"
        animation-mixer="clip: Dance; loop: repeat;"
        class="clickable" hover-glow>
      </a-entity>

      <a-light type="point" position="0 2.5 0" color="#ec4899" intensity="1.2" distance="6"></a-light>
      <a-text value="Companion Bot" position="0 2.6 0" align="center" color="#f472b6" width="5" font="kelsonsans"></a-text>
    </a-entity>

    <!-- =========== FLOATING ISLAND PLATFORMS (background mid-distance) =========== -->
    <!-- Left floating island -->
    <a-entity position="-18 5 -18">
      <a-cylinder radius="5" height="2"
        material="color:#0d0b1f; roughness:0.5; metalness:0.5">
      </a-cylinder>
      <!-- island bottom taper -->
      <a-cone position="0 -1.8 0" radius-bottom="1" radius-top="5" height="2"
        material="color:#0d0b1f; roughness:0.5; metalness:0.5">
      </a-cone>
      <!-- Island glow rim -->
      <a-cylinder position="0 1.06 0" radius="5.1" height="0.12"
        material="color:#818cf8; emissive:#818cf8; emissiveIntensity:0.7">
      </a-cylinder>
      <!-- Obelisk on island -->
      <a-cone position="0 3 0" radius-bottom="0.6" radius-top="0.05" height="5"
        material="color:#6366f1; emissive:#6366f1; emissiveIntensity:0.5; roughness:0.1; metalness:0.9"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
      </a-cone>
      <a-light type="point" position="0 5.5 0" color="#6366f1" intensity="1.5" distance="12"></a-light>
      <a-light type="point" position="0 1.5 0" color="#818cf8" intensity="0.8" distance="8"></a-light>
      <!-- Floating animation -->
      <a-animation attribute="position" from="-18 5 -18" to="-18 6.5 -18" direction="alternate" dur="5000" repeat="indefinite" easing="ease-in-out-sine"></a-animation>
    </a-entity>

    <!-- Right floating island -->
    <a-entity position="18 7 -20">
      <a-cylinder radius="4" height="1.5"
        material="color:#0d0b1f; roughness:0.5; metalness:0.5">
      </a-cylinder>
      <a-cone position="0 -1.5 0" radius-bottom="0.8" radius-top="4" height="1.8"
        material="color:#0d0b1f; roughness:0.5; metalness:0.5">
      </a-cone>
      <a-cylinder position="0 0.83 0" radius="4.08" height="0.1"
        material="color:#ec4899; emissive:#ec4899; emissiveIntensity:0.7">
      </a-cylinder>
      <!-- Portal ring on island -->
      <a-torus position="0 3 0" radius="1.8" radius-tubular="0.12"
        material="color:#ec4899; emissive:#ec4899; emissiveIntensity:0.8"
        animation="property: rotation; to: 360 0 360; loop: true; dur: 10000; easing: linear">
      </a-torus>
      <a-light type="point" position="0 3 0" color="#ec4899" intensity="2" distance="12"></a-light>
      <a-animation attribute="position" from="18 7 -20" to="18 5.5 -20" direction="alternate" dur="6500" repeat="indefinite" easing="ease-in-out-sine"></a-animation>
    </a-entity>

    <!-- =========== GLOBAL SCENE LIGHTING =========== -->
    <!-- Soft ambient -->
    <a-light type="ambient" color="#1a1440" intensity="0.8"></a-light>
    <!-- Distant directional key light -->
    <a-light type="directional" position="-5 15 8" color="#c7d2fe" intensity="0.5" cast-shadow="true"></a-light>
    <!-- Rim/fill from behind temple -->
    <a-light type="directional" position="5 8 -20" color="#818cf8" intensity="0.3"></a-light>

    <!-- =========== CAMERA RIG =========== -->
    <a-entity id="rig" movement-controls="speed: 0.15; fly: false;" position="0 0 5">
      <a-entity id="camera" camera position="0 1.65 0" look-controls="pointerLockEnabled: false">
        <a-cursor
          color="#818cf8"
          fuse="false"
          raycaster="objects: .clickable; far: 40"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 100; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-entity>

      <!-- Meta Quest 3 Left Controller -->
      <a-entity
        id="leftController"
        meta-touch-controls="hand: left"
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 40"
        line="color: #06b6d4; opacity: 0.9">
      </a-entity>

      <!-- Meta Quest 3 Right Controller -->
      <a-entity
        id="rightController"
        meta-touch-controls="hand: right"
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 40"
        line="color: #ec4899; opacity: 0.9">
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
