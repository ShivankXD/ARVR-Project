<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aetheria VR — Cyberpunk Sanctuary | Meta Quest 3 & WebVR</title>
  <meta name="description" content="An immersive WebVR floating sanctuary world for Meta Quest 3/3s built with A-Frame.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- A-Frame 1.7.1 Core Library -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- A-Frame Environment Component -->
  <script src="https://unpkg.com/aframe-environment-component@1.3.4/dist/aframe-environment-component.min.js"></script>

  <!-- A-Frame Extras for Animation & Controls -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <style>
    :root {
      --primary: #6366f1;
      --secondary: #ec4899;
      --cyan: #06b6d4;
      --bg-glass: rgba(10, 15, 30, 0.82);
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #030712;
      user-select: none;
    }

    /* 2D HUD Glass Overlay for Desktop Users */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 999;
      pointer-events: none;
    }

    .ui-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 18px 22px;
      color: #f8fafc;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      transition: transform 0.3s ease;
    }

    .ui-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .ui-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    .ui-title {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .ui-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.45;
    }

    .ui-controls {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .ui-controls li {
      margin-bottom: 4px;
      list-style-type: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #fff;
    }

    .ui-tags {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .tag {
      padding: 3px 10px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 12px;
      font-size: 0.72rem;
      color: #818cf8;
      font-weight: 600;
    }

    /* Custom VR Enter Button */
    .a-enter-vr-button {
      background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
      border-radius: 14px !important;
      border: none !important;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6) !important;
      padding: 12px 20px !important;
      transition: all 0.3s ease !important;
    }

    .a-enter-vr-button:hover {
      transform: scale(1.08) !important;
      filter: brightness(1.15) !important;
    }
  </style>

  <script>
    // Audio Synthesizer (Zero External File Audio Engine)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playSynth(freq, type = 'sine', duration = 0.5) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      playChimeSequence() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playSynth(freq, 'sine', 0.4), idx * 80);
        });
      },
      playWobble() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.4);
        } catch (e) {}
      }
    };

    // A-Frame Hover Component (Smooth Scaling + Glow)
    AFRAME.registerComponent('hover-scale', {
      schema: { scale: { type: 'vec3', default: { x: 1.12, y: 1.12, z: 1.12 } } },
      init: function () {
        const el = this.el;
        this.originalScale = el.getAttribute('scale') || { x: 1, y: 1, z: 1 };

        el.addEventListener('mouseenter', () => {
          el.setAttribute('animation__hover', {
            property: 'scale',
            to: `${this.originalScale.x * this.data.scale.x} ${this.originalScale.y * this.data.scale.y} ${this.originalScale.z * this.data.scale.z}`,
            dur: 200,
            easing: 'easeOutCubic'
          });
          AudioEngine.playSynth(783.99, 'sine', 0.2);
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('animation__hover', {
            property: 'scale',
            to: `${this.originalScale.x} ${this.originalScale.y} ${this.originalScale.z}`,
            dur: 250,
            easing: 'easeOutCubic'
          });
        });
      }
    });

    // Interactive Crystal Core (Color & Emission Cycle)
    AFRAME.registerComponent('crystal-core', {
      init: function () {
        const el = this.el;
        const light = el.querySelector('a-light');
        const octa = el.querySelector('a-octahedron');
        const label = document.querySelector('#crystal-label');
        const colors = [
          { name: 'Indigo Core', color: '#6366f1' },
          { name: 'Neon Magenta', color: '#ec4899' },
          { name: 'Cyan Plasma', color: '#06b6d4' },
          { name: 'Emerald Flux', color: '#10b981' },
          { name: 'Solar Amber', color: '#f59e0b' },
          { name: 'Cosmic Violet', color: '#a855f7' }
        ];
        let idx = 0;

        el.addEventListener('click', () => {
          idx = (idx + 1) % colors.length;
          const current = colors[idx];

          if (octa) {
            octa.setAttribute('material', 'color', current.color);
            octa.setAttribute('material', 'emissive', current.color);
          }
          if (light) {
            light.setAttribute('color', current.color);
          }
          if (label) {
            label.setAttribute('value', current.name);
          }

          AudioEngine.playChimeSequence();
        });
      }
    });

    // Realm Portal Switcher
    AFRAME.registerComponent('portal-switcher', {
      init: function () {
        const el = this.el;
        const realms = [
          { preset: 'starry', name: 'Starry Sky', ground: 'walkernoise', sky: 'atmosphere' },
          { preset: 'neon', name: 'Cyberpunk Neon', ground: 'spikes', sky: 'color' },
          { preset: 'dream', name: 'Ether Dream', ground: 'hills', sky: 'gradient' },
          { preset: 'volcano', name: 'Ashen Volcano', ground: 'canyon', sky: 'atmosphere' },
          { preset: 'forest', name: 'Mystic Forest', ground: 'squares', sky: 'atmosphere' }
        ];
        let idx = 0;

        el.addEventListener('click', () => {
          idx = (idx + 1) % realms.length;
          const target = realms[idx];
          const env = document.querySelector('#environment');

          env.setAttribute('environment', `preset: ${target.preset}; ground: ${target.ground}; dressingAmount: 30; shadow: true; skyType: ${target.sky};`);
          AudioEngine.playWobble();

          const label = document.querySelector('#portal-text');
          if (label) {
            label.setAttribute('value', `Portal to: ${target.name}`);
          }
        });
      }
    });

    // Companion Robot Control
    AFRAME.registerComponent('robot-control', {
      init: function () {
        const el = this.el;
        const anims = ['Dance', 'Jump', 'Walk', 'Idle'];
        let idx = 0;

        el.addEventListener('click', () => {
          idx = (idx + 1) % anims.length;
          const nextAnim = anims[idx];

          el.setAttribute('animation-mixer', `clip: ${nextAnim}; loop: repeat;`);
          AudioEngine.playSynth(880, 'square', 0.3);

          const label = document.querySelector('#robot-label');
          if (label) {
            label.setAttribute('value', `Companion Bot\nMode: ${nextAnim}`);
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- 2D HUD UI Card -->
  <div id="ui-overlay">
    <div class="ui-card">
      <div class="ui-header">
        <div class="ui-logo">✨</div>
        <div class="ui-title">Aetheria VR Realm</div>
      </div>
      <div class="ui-desc">
        A high-fidelity floating VR sanctuary built for <strong>Meta Quest 3 / 3s</strong> & WebVR exploration.
      </div>
      <div class="ui-controls">
        <li><span class="key-badge">WASD</span> Walk around world</li>
        <li><span class="key-badge">Mouse</span> Click & Drag to look</li>
        <li><span class="key-badge">Click</span> Interact with glowing objects</li>
        <li><span class="key-badge">VR</span> Click bottom-right button on Quest 3</li>
      </div>
      <div class="ui-tags">
        <span class="tag">A-Frame 1.7.1</span>
        <span class="tag">Meta Quest 3s</span>
        <span class="tag">WebXR</span>
      </div>
    </div>
  </div>

  <!-- A-Frame VR Scene -->
  <a-scene 
    renderer="antialias: true; colorManagement: true; exposure: 1.1; highRefreshRate: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- Assets -->
    <a-assets>
      <a-asset-item id="robot-model" src="https://modelviewer.dev/shared-assets/models/robot.glb"></a-asset-item>
      <a-asset-item id="helmet-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/DamagedHelmet/glTF-Binary/DamagedHelmet.glb"></a-asset-item>
      <a-asset-item id="astronaut-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"></a-asset-item>
    </a-assets>

    <!-- Procedural Environment Sky & Ground -->
    <a-entity 
      id="environment" 
      environment="preset: starry; groundColor: #0b0f19; groundTexture: walkernoise; dressing: towers; dressingColor: #1e1b4b; dressingAmount: 20; shadow: true; skyType: atmosphere; lightPosition: 1 5 -2;">
    </a-entity>

    <!-- Ambient & Key Lighting -->
    <a-light type="ambient" color="#38bdf8" intensity="0.35"></a-light>
    <a-light type="directional" color="#f472b6" intensity="0.75" position="-6 12 4" cast-shadow="true"></a-light>

    <!-- Camera Rig & VR Controllers (Meta Quest 3 Touch + Laser) -->
    <a-entity id="rig" movement-controls="speed: 0.18; fly: false;" position="0 0 4">
      <!-- Camera -->
      <a-entity 
        id="camera" 
        camera 
        position="0 1.6 0" 
        look-controls="pointerLockEnabled: false">
        
        <!-- Desktop Reticle Cursor -->
        <a-cursor
          id="cursor"
          color="#6366f1"
          fuse="false"
          raycaster="objects: .clickable; far: 30"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-entity>

      <!-- Meta Quest 3 Left Touch Controller -->
      <a-entity
        id="leftController"
        meta-touch-controls="hand: left"
        oculus-touch-controls="hand: left"
        laser-controls="hand: left"
        raycaster="objects: .clickable; far: 30"
        line="color: #06b6d4; opacity: 0.85">
      </a-entity>

      <!-- Meta Quest 3 Right Touch Controller -->
      <a-entity
        id="rightController"
        meta-touch-controls="hand: right"
        oculus-touch-controls="hand: right"
        laser-controls="hand: right"
        raycaster="objects: .clickable; far: 30"
        line="color: #ec4899; opacity: 0.85">
      </a-entity>
    </a-entity>


    <!-- ================= SCENERY & INTERACTIVE OBJECTS ================= -->

    <!-- 1. Central Welcome Gateway Signboard (Positioned High to avoid camera blocking) -->
    <a-entity position="0 3.8 -4.5">
      <!-- Backdrop Plate -->
      <a-plane 
        width="4" 
        height="1.2" 
        material="color: #090d16; opacity: 0.8; transparent: true; roughness: 0.2">
      </a-plane>
      
      <!-- Glowing Frame Ring -->
      <a-ring 
        radius-inner="2.0" 
        radius-outer="2.04" 
        scale="1.02 0.32 1"
        material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.9">
      </a-ring>

      <a-text 
        value="AETHERIA VR SANCTUARY" 
        position="0 0.25 0.02" 
        align="center" 
        color="#f8fafc" 
        width="6" 
        font="kelsonsans">
      </a-text>

      <a-text 
        value="Click Crystal to Change Colors • Click Portal to Switch World Realms • Click Companion Bot to Dance" 
        position="0 -0.2 0.02" 
        align="center" 
        color="#94a3b8" 
        width="3.6">
      </a-text>
    </a-entity>


    <!-- 2. Central Crystal Energy Obelisk (Interactive Color Core) -->
    <a-entity position="0 1.5 -4.5" crystal-core class="clickable" hover-scale>
      <!-- Levitating Crystal -->
      <a-octahedron 
        radius="1.0" 
        material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.6; roughness: 0.15; metalness: 0.85"
        animation="property: rotation; to: 0 360 360; loop: true; dur: 10000; easing: linear"
        animation__float="property: position; dir: alternate; to: 0 1.8 -4.5; loop: true; dur: 2200; easing: easeInOutSine">
      </a-octahedron>

      <!-- Inner Pulsing Core -->
      <a-sphere 
        radius="0.4" 
        material="color: #ffffff; emissive: #ffffff; emissiveIntensity: 1; opacity: 0.9"
        animation="property: scale; dir: alternate; to: 1.25 1.25 1.25; loop: true; dur: 900">
      </a-sphere>

      <!-- Point Light -->
      <a-light type="point" color="#6366f1" intensity="2.5" distance="12"></a-light>

      <!-- Pedestal Platform -->
      <a-cylinder 
        position="0 -0.8 0" 
        radius="1.2" 
        height="0.8" 
        material="color: #111827; roughness: 0.3; metalness: 0.7">
      </a-cylinder>

      <a-ring 
        position="0 -0.39 0" 
        rotation="-90 0 0" 
        radius-inner="0.6" 
        radius-outer="1.2" 
        material="color: #6366f1; emissive: #6366f1; emissiveIntensity: 0.5"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 7000; easing: linear">
      </a-ring>

      <!-- Label Plate -->
      <a-plane position="0 -1.3 0" width="1.6" height="0.4" material="color: #0f172a; opacity: 0.9">
        <a-text id="crystal-label" value="Indigo Core" position="0 0 0.01" align="center" color="#818cf8" width="3.5"></a-text>
      </a-plane>
    </a-entity>


    <!-- 3. Realm Gateway Portal (Left Wing: Interactive Environment Switcher) -->
    <a-entity position="-3.8 1.6 -3.5" rotation="0 30 0" portal-switcher class="clickable" hover-scale>
      <!-- Outer Torus Ring -->
      <a-torus 
        radius="1.3" 
        radius-tubular="0.08" 
        material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.9"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 14000; easing: linear">
      </a-torus>

      <!-- Inner Portal Void Swirl -->
      <a-circle 
        radius="1.2" 
        material="color: #3b82f6; opacity: 0.7; transparent: true; side: double"
        animation="property: rotation; to: 0 0 -360; loop: true; dur: 5000; easing: linear">
      </a-circle>

      <!-- Base Pedestal -->
      <a-box position="0 -1.4 0" width="1.6" height="0.3" depth="0.8" material="color: #1e293b"></a-box>

      <!-- Portal Text Label -->
      <a-plane position="0 1.8 0" width="2.4" height="0.5" material="color: #0f172a; opacity: 0.85">
        <a-text id="portal-text" value="Portal to: Starry Sky" position="0 0 0.01" align="center" color="#38bdf8" width="3.8"></a-text>
      </a-plane>
    </a-entity>


    <!-- 4. Companion Robot (Right Wing: Interactive Animated 3D Model) -->
    <a-entity 
      position="3.8 0 -3.5" 
      rotation="0 -30 0" 
      scale="0.75 0.75 0.75"
      gltf-model="#robot-model"
      animation-mixer="clip: Dance; loop: repeat;"
      robot-control
      class="clickable"
      hover-scale>
      
      <!-- Hologram Platform Base -->
      <a-cylinder position="0 0 0" radius="1.2" height="0.1" material="color: #ec4899; emissive: #ec4899; emissiveIntensity: 0.4"></a-cylinder>

      <!-- Label -->
      <a-plane position="0 2.6 0" width="2.4" height="0.6" material="color: #0f172a; opacity: 0.85">
        <a-text id="robot-label" value="Companion Bot\nMode: Dance" position="0 0 0.01" align="center" color="#f472b6" width="3.6"></a-text>
      </a-plane>
    </a-entity>


    <!-- 5. Sci-Fi Relic Display (Far Right: Damaged Helmet) -->
    <a-entity position="5.5 1.2 -1" rotation="0 -75 0" class="clickable" hover-scale>
      <a-gltf-model 
        src="#helmet-model" 
        scale="1.1 1.1 1.1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear">
      </a-gltf-model>
      
      <a-cylinder position="0 -0.6 0" radius="0.6" height="0.1" material="color: #06b6d4; emissive: #06b6d4; emissiveIntensity: 0.5"></a-cylinder>
      <a-plane position="0 1.1 0" width="1.8" height="0.4" material="color: #0f172a; opacity: 0.85">
        <a-text value="Ancient Relic" position="0 0 0.01" align="center" color="#22d3ee" width="3.2"></a-text>
      </a-plane>
    </a-entity>


    <!-- 6. Explorer Vanguard (Far Left: Astronaut Model) -->
    <a-entity position="-5.5 0 -1" rotation="0 75 0" class="clickable" hover-scale>
      <a-gltf-model 
        src="#astronaut-model" 
        scale="0.85 0.85 0.85"
        animation__hover="property: position; dir: alternate; to: -5.5 0.25 -1; loop: true; dur: 2800; easing: easeInOutQuad">
      </a-gltf-model>

      <a-plane position="0 2.4 0" width="2.2" height="0.4" material="color: #0f172a; opacity: 0.85">
        <a-text value="Explorer Vanguard" position="0 0 0.01" align="center" color="#a855f7" width="3.5"></a-text>
      </a-plane>
    </a-entity>


    <!-- 7. Majestic Horizon Cosmic Rings (Distant Background Sky) -->
    <a-entity position="0 12 -22">
      <a-torus 
        radius="12" 
        radius-tubular="0.08" 
        material="color: #818cf8; emissive: #818cf8; emissiveIntensity: 0.7"
        animation="property: rotation; to: 360 180 0; loop: true; dur: 35000; easing: linear">
      </a-torus>
      <a-torus 
        radius="16" 
        radius-tubular="0.06" 
        material="color: #f472b6; emissive: #f472b6; emissiveIntensity: 0.6"
        animation="property: rotation; to: -360 360 180; loop: true; dur: 45000; easing: linear">
      </a-torus>
    </a-entity>

  </a-scene>

</body>
</html>
